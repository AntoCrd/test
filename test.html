<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRITICAL OVERRIDE | LE STUDIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        /* ==========================================================================
           1. FONDATION DU SYSTÈME
           ========================================================================== */
        :root {
            --bg: #030303;
            --txt: #FFFFFF;
            --red: #FF0000;
            --border: #222222;
            --dim: rgba(255, 255, 255, 0.4);
            --grid: rgba(255, 255, 255, 0.02);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        
        body { 
            background-color: var(--bg); color: var(--txt); 
            font-family: 'Space Mono', monospace; line-height: 1.4;
            display: flex; align-items: center; justify-content: center; height: 100vh;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 50px 50px;
            overflow: hidden; 
        }

        .scanline { position: fixed; inset: 0; background: linear-gradient(to bottom, transparent 50%, rgba(255,255,255,0.02) 50%); background-size: 100% 4px; pointer-events: none; z-index: 1000; }

        /* ==========================================================================
           2. OVERLAY ET BOÎTE DE LA MODALE
           ========================================================================== */
        .modal-overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(10px); 
            z-index: 20000; display: flex; align-items: center; justify-content: center; 
            opacity: 0; transition: opacity 0.5s ease; padding: 20px;
        }
        .modal-overlay.active { opacity: 1; }
        
        .modal-box { 
            width: 100%; max-width: 700px; background: #050505; border: 1px solid var(--border); 
            box-shadow: 0 30px 80px rgba(255,0,0,0.15); position: relative;
            transform: translateY(30px) scale(0.95); transition: transform 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .modal-overlay.active .modal-box { transform: translateY(0) scale(1); }

        /* Crochets de ciblage (Corners Blueprint) */
        .modal-box::before, .modal-box::after {
            content: ''; position: absolute; width: 30px; height: 30px; border: 2px solid var(--red); pointer-events: none; z-index: 10;
        }
        .modal-box::before { top: -2px; left: -2px; border-bottom: none; border-right: none; }
        .modal-box::after { bottom: -2px; right: -2px; border-top: none; border-left: none; }

        /* ==========================================================================
           3. HEADER TECHNIQUE
           ========================================================================== */
        .modal-header { 
            background: var(--red); color: var(--txt); padding: 10px 25px; 
            font-size: 9px; font-weight: bold; letter-spacing: 4px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .blink-warning { animation: blink 1s infinite; display: flex; align-items: center; gap: 10px;}
        .warning-icon { width: 10px; height: 10px; background: var(--txt); border-radius: 50%; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ==========================================================================
           4. CORPS ET TYPOGRAPHIE
           ========================================================================== */
        .modal-body { padding: 60px 50px; text-align: center; position: relative; }
        
        .label-red { 
            display: inline-block; border: 1px solid var(--red); color: var(--red); 
            padding: 4px 12px; font-size: 9px; text-transform: uppercase; margin-bottom: 25px; 
            letter-spacing: 3px; font-weight: bold; background: rgba(255,0,0,0.05);
        }

        .modal-title { 
            font-family: 'Anton'; font-size: 3.5rem; color: var(--txt); 
            margin-bottom: 20px; line-height: 0.9; text-transform: uppercase; letter-spacing: 1px;
        }
        
        .modal-text { 
            font-family: 'Playfair Display'; font-size: 18px; color: var(--dim); 
            margin-bottom: 40px; font-style: italic; line-height: 1.5; max-width: 500px; margin-inline: auto;
        }

        /* ==========================================================================
           5. DATA LOSS PREVIEW (LA PERTE)
           ========================================================================== */
        .data-loss-preview {
            border: 1px dashed var(--border); background: rgba(0,0,0,0.5); padding: 25px;
            margin-bottom: 50px; text-align: left; display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            position: relative;
        }
        
        .loss-item { display: flex; flex-direction: column; gap: 5px; border-left: 2px solid var(--red); padding-left: 15px; }
        .loss-item label { font-size: 8px; color: var(--dim); letter-spacing: 2px; text-transform: uppercase; }
        .loss-item span { font-size: 16px; font-weight: bold; color: var(--txt); font-family: 'Space Mono'; }
        
        /* Jauge de purge */
        .purge-container { grid-column: span 2; margin-top: 10px; }
        .purge-labels { display: flex; justify-content: space-between; font-size: 9px; margin-bottom: 8px; letter-spacing: 1px; }
        .purge-labels span:first-child { color: var(--red); }
        .purge-labels span:last-child { color: var(--txt); animation: blink 1s infinite; }
        
        .purge-bar-bg { width: 100%; height: 2px; background: var(--border); position: relative; overflow: hidden; }
        .purge-bar-fill { position: absolute; top: 0; left: 0; height: 100%; width: 100%; background: var(--red); transform-origin: left; box-shadow: 0 0 10px var(--red); }
        
        /* Animation déclenchée en JS */
        .purge-active { animation: purge-drain 10s linear forwards; }
        @keyframes purge-drain { 0% { transform: scaleX(1); } 100% { transform: scaleX(0); } }

        /* ==========================================================================
           6. ACTIONS
           ========================================================================== */
        .modal-actions { display: flex; gap: 20px; justify-content: center; }

        /* Action Positive : Bouton Massif */
        .btn-modal-primary { 
            background: var(--txt); color: var(--bg); border: 1px solid var(--txt); 
            font-family: 'Anton'; font-size: 1.5rem; padding: 15px 30px; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase; flex-grow: 1.5; 
            letter-spacing: 1px; position: relative; overflow: hidden; z-index: 1;
        }
        .btn-modal-primary::before {
            content: ''; position: absolute; top: 0; left: 0; width: 0%; height: 100%;
            background: var(--red); z-index: -1; transition: 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .btn-modal-primary:hover { border-color: var(--red); color: var(--txt); }
        .btn-modal-primary:hover::before { width: 100%; }

        /* Action Destructive : Bouton Discret */
        .btn-modal-secondary { 
            background: transparent; color: var(--dim); border: 1px solid var(--border); 
            font-family: 'Space Mono'; font-size: 11px; padding: 15px 20px; 
            cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 2px; flex-grow: 1; 
        }
        .btn-modal-secondary:hover { border-color: var(--txt); color: var(--txt); }

        @media (max-width: 700px) {
            .modal-body { padding: 40px 20px; }
            .modal-actions { flex-direction: column-reverse; gap: 15px; }
            .data-loss-preview { grid-template-columns: 1fr; gap: 30px; }
            .purge-container { grid-column: span 1; }
            .modal-title { font-size: 2.5rem; }
            .btn-modal-primary { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <div id="abort-modal" class="modal-overlay">
        <div class="modal-box">
            
            <div class="modal-header">
                <span class="blink-warning"><div class="warning-icon"></div> OVERRIDE_INITIATED</span>
                <span>SYS_ERR: 404</span>
            </div>
            
            <div class="modal-body">
                <span class="label-red">INTERRUPTION DÉTECTÉE</span>
                <h2 class="modal-title">ANNULER LA RÉSERVATION ?</h2>
                <p class="modal-text">
                    Le verrouillage de votre canal est sur le point d'être levé. Vos accès seront purgés et immédiatement réattribués.
                </p>

                <div class="data-loss-preview">
                    <div class="loss-item">
                        <label>SÉQUENCE EN COURS</label>
                        <span id="loss-movie-name">BLADE RUNNER</span>
                    </div>
                    <div class="loss-item">
                        <label>UNITÉS RÉSERVÉES</label>
                        <span id="loss-pax">02 PAX</span>
                    </div>
                    
                    <div class="purge-container">
                        <div class="purge-labels">
                            <span>EXPIRATION DU VERROUILLAGE</span>
                            <span>PURGE IMMINENTE...</span>
                        </div>
                        <div class="purge-bar-bg"><div class="purge-bar-fill" id="purge-bar"></div></div>
                    </div>
                </div>

                <div class="modal-actions">
                    <button class="btn-modal-secondary" onclick="actionDetruire()">OUI, TOUT ANNULER</button>
                    <button class="btn-modal-primary" onclick="actionSauver()">NON, REPRENDRE LA RÉSERVATION</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Déclenchement automatique et fluide au chargement
        window.addEventListener('load', () => {
            setTimeout(() => {
                const modal = document.getElementById('abort-modal');
                const purgeBar = document.getElementById('purge-bar');
                
                modal.classList.add('active');
                purgeBar.classList.add('purge-active'); // Lance le compte à rebours visuel
            }, 300); // Petit délai pour laisser la grille de fond apparaître
        });

        function actionSauver() {
            document.getElementById('abort-modal').classList.remove('active');
            // En production : Retour au formulaire de réservation
        }

        function actionDetruire() {
            document.getElementById('abort-modal').classList.remove('active');
            // En production : Redirection vers l'accueil et reset des données
            setTimeout(() => alert("Système purgé. Retour au Monitoring des canaux."), 400); 
        }
    </script>
</body>
</html>
