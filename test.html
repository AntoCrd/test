<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RunAlert — Profil</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F4F5F8;--card:#FFFFFF;--acc:#FF3B30;--acc-glow:rgba(255,59,48,.25);--ink:#0B0F19;--sub:#848A9C;--faint:#B8BCC9;--line:#ECEDF1;--shadow:0 4px 24px rgba(11,15,25,.06),0 1px 4px rgba(11,15,25,.04);--df:'Outfit',sans-serif;--db:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--db);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:96px}a{text-decoration:none;color:inherit}button{font-family:var(--db);cursor:pointer;border:none;background:none;color:inherit}::-webkit-scrollbar{display:none}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}.r{animation:rise .5s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:50ms}.d2{animation-delay:100ms}.d3{animation-delay:150ms}

.page-title{font-family:var(--df);font-size:28px;font-weight:900;letter-spacing:-.04em;padding:20px 22px 0}.dot{color:var(--acc)}

.profile-card{text-align:center;padding:32px 22px}
.avatar{width:80px;height:80px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;box-shadow:0 8px 28px var(--acc-glow)}
.avatar span{font-family:var(--df);font-size:26px;font-weight:900;color:#fff}
.profile-name{font-family:var(--df);font-size:22px;font-weight:900;letter-spacing:-.02em}
.profile-info{color:var(--sub);font-size:13px;font-weight:500;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:5px}

.stats{display:flex;gap:12px;padding:0 22px;margin-bottom:30px}
.stat-card{flex:1;border-radius:24px;padding:18px 12px;background:var(--card);box-shadow:var(--shadow);text-align:center}
.stat-val{font-family:var(--df);font-size:24px;font-weight:900;color:var(--ink);letter-spacing:-.03em;font-style:italic}
.stat-label{color:var(--sub);font-size:11px;font-weight:500;margin-top:3px}

.menu{border-radius:24px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin:0 22px}
.menu-item{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.menu-item:last-child{border-bottom:none}
.menu-item span{flex:1;font-size:14px;font-weight:500;color:var(--ink)}
.menu-item.danger span{color:#EF4444}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;padding:0 16px 10px}
.bottom-nav-inner{border-radius:50px;padding:6px 8px;display:flex;justify-content:space-around;background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 -2px 20px rgba(11,15,25,.06)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:50px;position:relative}.nav-label{font-size:10px;font-weight:500;color:var(--sub)}.nav-item.active .nav-label{font-weight:700;color:var(--acc)}
.nav-badge{position:absolute;top:2px;right:4px;min-width:16px;height:16px;border-radius:50px;background:var(--acc);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 8px var(--acc-glow)}
</style>
</head>
<body>

<h1 class="page-title r">Profil<span class="dot">.</span></h1>

<div class="profile-card r d1">
  <div class="avatar"><span>LD</span></div>
  <h2 class="profile-name">Lucas Dupont</h2>
  <p class="profile-info">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
    Lyon · Intermédiaire
  </p>
</div>

<div class="stats r d2">
  <div class="stat-card">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 8px;display:block"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
    <p class="stat-val">3</p>
    <p class="stat-label">Favoris</p>
  </div>
  <div class="stat-card">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 8px;display:block"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <p class="stat-val">4</p>
    <p class="stat-label">Rappels</p>
  </div>
  <div class="stat-card">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin:0 auto 8px;display:block"><circle cx="12" cy="8" r="7"/><path d="M8.21 13.89 7 23l5-3 5 3-1.21-9.12"/></svg>
    <p class="stat-val">12</p>
    <p class="stat-label">Courses</p>
  </div>
</div>

<div class="menu r d3">
  <button class="menu-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg>
    <span>Modifier le profil</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4D7E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button class="menu-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    <span>Préférences</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4D7E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button class="menu-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>Paramètres</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4D7E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button class="menu-item">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
    <span>Contact</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4D7E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <button class="menu-item danger">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    <span>Déconnexion</span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D4D7E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<nav class="bottom-nav"><div class="bottom-nav-inner">
  <a href="index.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Accueil</span></a>

  <a href="favorites.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span class="nav-label">Favoris</span></a>
  <a href="notifications.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="nav-label">Alertes</span><span class="nav-badge">2</span></a>
  <a href="profile.html" class="nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span class="nav-label" style="color:#FF3B30;font-weight:700">Profil</span></a>
</div></nav>
</body>
