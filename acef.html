<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espace ACEF — Connexion</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --marine:     #0D1235;
      --marine-mid: #1A2456;
      --bleu:       #2B3A9E;
      --bleu-light: #EEF1FA;
      --orange:     #F5A623;
      --gris:       #6B7A9E;
      --border:     #E2E6F0;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Barlow', sans-serif;
      background: #F4F5F9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .page-label {
      position: fixed;
      top: 28px;
      left: 36px;
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gris);
    }

    .card {
      background: #fff;
      border-radius: 24px;
      padding: 56px 52px;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 4px 40px rgba(13,18,53,0.08);
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 36px;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
    }

    .logo-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 20px;
      color: var(--marine);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .logo-sub {
      font-size: 10px;
      font-weight: 500;
      color: var(--gris);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .main-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: clamp(44px, 8vw, 62px);
      color: var(--marine);
      text-align: center;
      line-height: 1;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .pill {
      background: var(--marine);
      color: #fff;
      border-radius: 100px;
      padding: 6px 26px 10px;
      font-size: inherit;
      font-weight: 900;
      font-family: inherit;
      position: relative;
      display: inline-block;
    }

    .pill::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 100px;
      background: var(--bleu);
      opacity: 0.18;
      filter: blur(10px);
      z-index: -1;
    }

    .fields {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--marine);
      margin-bottom: 8px;
    }

    .input-wrap { position: relative; }

    .input-wrap input {
      width: 100%;
      padding: 16px 20px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      color: var(--marine);
      background: #FAFBFE;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }

    .input-wrap input::placeholder { color: #B8C0D8; }

    .input-wrap input:focus {
      border-color: var(--bleu);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(43,58,158,0.07);
    }

    .btn-show {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--gris);
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-show:hover { color: var(--bleu); }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .check-label {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      font-size: 13px;
      color: var(--gris);
    }

    .check-label input[type="checkbox"] {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
      flex-shrink: 0;
    }

    .check-label input:checked {
      background: var(--marine);
      border-color: var(--marine);
    }

    .check-label input:checked::after {
      content: '';
      position: absolute;
      left: 5px;
      top: 2px;
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .forgot {
      font-size: 13px;
      font-weight: 500;
      color: var(--gris);
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot:hover { color: var(--bleu); }

    .btn-cta {
      width: 100%;
      padding: 16px 20px 16px 28px;
      background: var(--marine);
      border: none;
      border-radius: 100px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
      margin-bottom: 16px;
    }

    .btn-cta:hover {
      background: var(--marine-mid);
      transform: translateY(-1px);
    }

    .btn-cta:active { transform: translateY(0); }

    .btn-cta-label {
      font-family: 'Barlow', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
    }

    .btn-arrow {
      width: 40px;
      height: 40px;
      background: #fff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.2s;
      flex-shrink: 0;
    }

    .btn-cta:hover .btn-arrow {
      background: var(--orange);
      transform: rotate(45deg);
    }

    .access-note {
      background: #FAFBFE;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
    }

    .access-note p {
      font-size: 13px;
      color: var(--gris);
      line-height: 1.6;
    }

    .access-note a {
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
      font-weight: 700;
      color: var(--marine);
      text-decoration: none;
      transition: color 0.2s;
    }

    .access-note a:hover { color: var(--bleu); }

    .card-footer {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .dot-orange {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--orange);
    }

    .card-footer p {
      font-size: 11px;
      color: #B8C0D8;
    }

    @media (max-width: 600px) {
      .card { padding: 40px 24px; }
      .main-title { font-size: 38px; gap: 10px; }
      .page-label { display: none; }
    }
  </style>
</head>
<body>

  <div class="page-label">Connexion</div>

  <div class="card">

    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="42" height="42" rx="10" fill="#0D1235"/>
        <path d="M10 10h12c3.3 0 6 2.7 6 6s-2.7 6-6 6H10V10z" fill="#2B3A9E"/>
        <path d="M10 22h13c3.3 0 6 2.7 6 6s-2.7 6-6 6H10V22z" fill="#F5A623"/>
      </svg>
      <div>
        <div class="logo-name">Bimier Solutions</div>
        <div class="logo-sub">Portail partenaire</div>
      </div>
    </div>

    <div class="main-title">
      Espace&nbsp;<span class="pill">Privé</span>&nbsp;ACEF
    </div>

    <form onsubmit="return false;">
      <div class="fields">
        <div class="field">
          <label for="email">Adresse e-mail pro</label>
          <div class="input-wrap">
            <input type="email" id="email" placeholder="jean.dupont@acef.fr" autocomplete="email" />
          </div>
        </div>
        <div class="field">
          <label for="pwd">Mot de passe</label>
          <div class="input-wrap">
            <input type="password" id="pwd" placeholder="••••••••••" autocomplete="current-password" />
            <button class="btn-show" type="button" onclick="togglePwd(this)">Afficher</button>
          </div>
        </div>
      </div>

      <div class="options">
        <label class="check-label">
          <input type="checkbox" />
          Mémoriser
        </label>
        <a href="#" class="forgot">Mot de passe oublié ?</a>
      </div>

      <button class="btn-cta" type="submit">
        <span class="btn-cta-label">Accéder au portail</span>
        <div class="btn-arrow">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0D1235" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 17L17 7M17 7H7M17 7v10"/>
          </svg>
        </div>
      </button>

      <div class="access-note">
        <p>L'accès à ce portail est strictement réservé.<br>Pas de compte ?</p>
        <a href="#">Contactez votre administrateur</a>
      </div>
    </form>

    <div class="card-footer">
      <div class="dot-orange"></div>
      <p>© 2026 Bimier Solutions · Partenaire exclusif ACEF</p>
    </div>

  </div>

  <script>
    function togglePwd(btn) {
      const input = document.getElementById('pwd');
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Masquer';
      } else {
        input.type = 'password';
        btn.textContent = 'Afficher';
      }
    }
  </script>

</body>
</html>
