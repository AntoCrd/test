<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Espace Privé ACEF</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           1. VARIABLES CSS & RESET
           ========================================================================== */
        :root {
            --blue-primary: #2563EB; 
            --blue-hover: #1D4ED8;
            --blue-light: #EFF6FF;
            --bg-body: #F8FAFC;
            --bg-white: #FFFFFF;
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --dark-card: #0A0A0A;
            --border-light: #E2E8F0;
            
            --radius-pill: 100px;
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 16px;
            
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-fast: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-dark); 
            line-height: 1.6; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            position: relative;
            overflow-x: hidden;
            /* Motif de fond subtil pour donner de la texture */
            background-image: radial-gradient(var(--border-light) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        /* --- LUEUR AMBIANTE ANIMÉE (Dynamic Glow) --- */
        .ambient-glow {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            width: 800px; height: 800px;
            background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, transparent 60%);
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
            animation: breathe 8s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        a { text-decoration: none; color: inherit; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 5%; width: 100%; }

        /* --- ANIMATIONS EN CASCADE (Staggered) --- */
        .fade-up { opacity: 0; animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }
        .delay-3 { animation-delay: 0.3s; }
        .delay-4 { animation-delay: 0.4s; }
        .delay-5 { animation-delay: 0.5s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==========================================================================
           2. NAVBAR
           ========================================================================== */
        .navbar { padding: 40px 0; width: 100%; z-index: 10; }
        .nav-inner { display: flex; justify-content: center; align-items: center; }
        .logo { font-size: 2rem; font-weight: 800; letter-spacing: -1px; color: var(--text-dark); transition: transform 0.3s ease; cursor: pointer; }
        .logo:hover { transform: scale(1.05); }
        .logo span { color: var(--blue-primary); }

        /* ==========================================================================
           3. LAYOUT CENTRAL MASSIF
           ========================================================================== */
        .login-wrapper {
            flex-grow: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 20px 0 80px; z-index: 1;
        }

        .login-header { text-align: center; margin-bottom: 50px; max-width: 800px; }
        
        .statement-text {
            font-size: 4rem; font-weight: 800; line-height: 1.1;
            letter-spacing: -2px; color: var(--text-dark); margin-bottom: 24px;
        }
        
        .statement-badge {
            display: inline-block; background-color: var(--blue-primary); color: var(--bg-white);
            padding: 4px 28px; border-radius: var(--radius-pill); font-weight: 800;
            vertical-align: middle; margin: 0 8px; line-height: 1.2;
            box-shadow: 0 10px 20px rgba(37,99,235,0.3);
            animation: floatBadge 4s infinite ease-in-out; /* Micro-animation du badge */
        }

        @keyframes floatBadge {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); box-shadow: 0 15px 25px rgba(37,99,235,0.4); }
        }

        .login-subtitle { font-size: 1.25rem; color: var(--text-muted); font-weight: 500; }

        /* ==========================================================================
           4. CARTE DE CONNEXION DYNAMIQUE
           ========================================================================== */
        .login-card {
            background: var(--bg-white); width: 100%; max-width: 500px;
            padding: 48px; border-radius: var(--radius-xl);
            box-shadow: 0 20px 50px -10px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            transition: box-shadow 0.4s ease;
        }

        .login-card:hover { box-shadow: 0 30px 60px -15px rgba(15, 23, 42, 0.12); }

        .form-group { margin-bottom: 24px; position: relative; }
        .form-group label { display: block; font-weight: 800; font-size: 0.95rem; color: var(--text-dark); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; transition: color 0.3s; }
        
        /* Focus-within permet d'animer le label quand l'input est actif */
        .form-group:focus-within label { color: var(--blue-primary); }

        .input-wrapper { position: relative; }
        
        .form-group input {
            width: 100%; padding: 20px 24px; border-radius: var(--radius-md);
            border: 2px solid var(--border-light); background: var(--bg-body);
            font-family: inherit; font-size: 1.1rem; font-weight: 600; color: var(--text-dark);
            transition: var(--transition-fast); outline: none;
        }

        /* Micro-interaction sur les inputs : Levitation */
        .form-group input:focus { 
            border-color: var(--blue-primary); 
            background: var(--bg-white); 
            box-shadow: 0 10px 20px -5px rgba(37,99,235,0.15), 0 0 0 4px var(--blue-light); 
            transform: translateY(-2px);
        }
        .form-group input::placeholder { color: #CBD5E1; font-weight: 500; transition: opacity 0.3s; }
        .form-group input:focus::placeholder { opacity: 0.5; }

        .toggle-pwd {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; font-size: 0.9rem; font-weight: 700; padding: 4px;
            transition: var(--transition-fast);
        }
        .toggle-pwd:hover { color: var(--blue-primary); transform: translateY(-50%) scale(1.05); }

        .form-options { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; font-size: 0.95rem; font-weight: 600; }

        /* Checkbox avec animation "Pop" */
        .checkbox-label { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-dark); }
        .checkbox-label input { appearance: none; width: 22px; height: 22px; border: 2px solid var(--border-light); border-radius: 6px; cursor: pointer; position: relative; transition: var(--transition-fast); flex-shrink: 0; }
        .checkbox-label input:hover { border-color: var(--blue-primary); }
        .checkbox-label input:checked { background-color: var(--text-dark); border-color: var(--text-dark); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .checkbox-label input:checked::after { content: '✔'; position: absolute; color: white; font-size: 12px; top: 50%; left: 50%; transform: translate(-50%, -50%); }

        @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(0.9); } 100% { transform: scale(1); } }

        .forgot-link { color: var(--text-muted); transition: var(--transition-fast); position: relative; }
        .forgot-link::after { content: ''; position: absolute; width: 100%; transform: scaleX(0); height: 2px; bottom: -2px; left: 0; background-color: var(--blue-primary); transform-origin: bottom right; transition: transform 0.3s ease-out; }
        .forgot-link:hover { color: var(--blue-primary); }
        .forgot-link:hover::after { transform: scaleX(1); transform-origin: bottom left; }

        /* ==========================================================================
           5. BOUTON D'ACTION (Effet Magnétique)
           ========================================================================== */
        .btn-submit {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            background: var(--dark-card); color: var(--bg-white);
            border: none; padding: 16px 24px; border-radius: var(--radius-pill);
            font-size: 1.1rem; font-weight: 800; cursor: pointer;
            transition: var(--transition-smooth); font-family: inherit;
            position: relative; overflow: hidden;
        }
        
        .btn-submit::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--blue-primary); transform: translateX(-100%);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 0;
        }

        .btn-submit span { position: relative; z-index: 1; transition: transform 0.3s; }
        
        .btn-submit:hover { transform: translateY(-4px); box-shadow: 0 15px 30px rgba(37,99,235,0.3); }
        .btn-submit:hover::before { transform: translateX(0); }
        .btn-submit:hover span { transform: translateX(10px); }

        .btn-submit .icon-circle {
            width: 36px; height: 36px; border-radius: 50%;
            background-color: var(--bg-white); color: var(--text-dark);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); font-size: 1.2rem;
            position: relative; z-index: 1;
        }
        
        /* L'icône tourne et sort presque du bouton au hover */
        .btn-submit:hover .icon-circle { transform: rotate(45deg) scale(1.1); color: var(--blue-primary); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }

        .btn-submit.loading { background: var(--text-muted); pointer-events: none; justify-content: center; }
        .btn-submit.loading::before { display: none; }
        .btn-submit.loading .icon-circle { display: none; }
        .btn-submit.loading span { transform: none; }

        /* ==========================================================================
           6. BLOC INFO
           ========================================================================== */
        .no-account-info {
            margin-top: 40px; padding: 24px; background: rgba(248, 250, 252, 0.5);
            border-radius: var(--radius-md); text-align: center;
            border: 1px dashed var(--border-light);
            transition: var(--transition-fast);
        }
        
        .no-account-info:hover { border-color: var(--blue-primary); background: var(--bg-white); }
        .no-account-info p { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .no-account-info a { color: var(--text-dark); font-weight: 800; border-bottom: 2px solid var(--border-light); padding-bottom: 2px; transition: var(--transition-fast); }
        .no-account-info a:hover { color: var(--blue-primary); border-color: var(--blue-primary); }

        /* Responsive */
        @media (max-width: 768px) {
            .statement-text { font-size: 2.8rem; letter-spacing: -1px; }
            .login-card { padding: 32px 24px; border-radius: 0; border-left: none; border-right: none; box-shadow: none; background: transparent; }
            .login-wrapper { padding: 0; justify-content: flex-start; }
            .ambient-glow { display: none; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <nav class="navbar fade-up">
        <div class="container nav-inner">
            <a href="index.html" class="logo">Bimier<span>.</span></a>
        </div>
    </nav>

    <main class="login-wrapper container">
        
        <div class="login-header fade-up delay-1">
            <h1 class="statement-text">Espace <span class="statement-badge">Privé</span> ACEF.</h1>
            <p class="login-subtitle">Accédez à votre catalogue exclusif, gérez vos devis et suivez vos commandes de goodies.</p>
        </div>

        <div class="login-card fade-up delay-2">
            <form id="loginForm">
                
                <div class="form-group fade-up delay-3">
                    <label for="email">Adresse e-mail pro</label>
                    <input type="email" id="email" placeholder="jean.dupont@acef.fr" required autocomplete="email">
                </div>

                <div class="form-group fade-up delay-4">
                    <label for="password">Mot de passe</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="toggle-pwd" id="togglePwd">Afficher</button>
                    </div>
                </div>

                <div class="form-options fade-up delay-5">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember"> Mémoriser
                    </label>
                    <a href="#" class="forgot-link">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="btn-submit fade-up delay-5" id="submitBtn">
                    <span>Accéder au portail</span>
                    <div class="icon-circle">↗</div>
                </button>
            </form>

            <div class="no-account-info fade-up delay-5">
                <p>L'accès à ce portail est strictement réservé.</p>
                <p>Pas de compte ? <a href="mailto:contact@bimier-solutions.fr">Contactez votre administrateur</a>.</p>
            </div>
        </div>

    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            const pwdInput = document.getElementById('password');
            const togglePwdBtn = document.getElementById('togglePwd');
            const loginForm = document.getElementById('loginForm');
            const submitBtn = document.getElementById('submitBtn');

            // Afficher / Masquer le mot de passe
            togglePwdBtn.addEventListener('click', () => {
                const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
                pwdInput.setAttribute('type', type);
                togglePwdBtn.textContent = type === 'password' ? 'Afficher' : 'Masquer';
            });

            // Focus dynamique pour soulever le bouton "Afficher"
            pwdInput.addEventListener('focus', () => togglePwdBtn.style.transform = 'translateY(calc(-50% - 2px))');
            pwdInput.addEventListener('blur', () => togglePwdBtn.style.transform = 'translateY(-50%)');

            // Simulation de connexion
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Animation de chargement
                submitBtn.classList.add('loading');
                submitBtn.innerHTML = '<span>Authentification...</span>';

                // Simulation du délai
                setTimeout(() => {
                    submitBtn.classList.remove('loading');
                    submitBtn.style.backgroundColor = '#10B981'; // Vert
                    submitBtn.innerHTML = '<span>Connexion validée ✓</span>';
                    
                    // Redirection
                    setTimeout(() => {
                        window.location.href = 'catalogue.html';
                    }, 800);
                    
                }, 1000);
            });
        });
    </script>

</body>
</html>
