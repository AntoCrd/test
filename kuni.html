<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01 - Connexion | Luxe & Élitisme</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-core: #55121C; 
            --brand-accent: #ff2a55;
            --brand-gold: #E5B9A8;
            
            --bg-base: #040101;
            
            /* Verre et Matériaux */
            --glass-input: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-border-focus: rgba(255, 42, 85, 0.5);
            
            --text-pure: #FFFFFF;
            --text-dim: rgba(255, 255, 255, 0.5);
            
            --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* --- FONDATIONS --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: var(--text-pure); overflow: hidden; }

        .device {
            width: 375px; height: 812px; position: relative; border-radius: 48px; overflow: hidden;
            background: var(--bg-base); box-shadow: 0 0 0 2px #1a1a1a, 0 50px 100px rgba(0,0,0,1);
        }

        .device::after { content: ''; position: absolute; inset: 0; background: var(--noise); opacity: 0.04; pointer-events: none; z-index: 100; mix-blend-mode: overlay; }

        /* --- ATMOSPHÈRE LUMINEUSE --- */
        .ambient-glow { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
        .glow-1 { position: absolute; top: -150px; left: 50%; transform: translateX(-50%); width: 150%; height: 500px; background: radial-gradient(circle, rgba(85, 18, 28, 0.8) 0%, transparent 70%); animation: pulseGlow 10s infinite alternate; }
        .glow-2 { position: absolute; bottom: -100px; right: -50px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(255, 42, 85, 0.1) 0%, transparent 70%); }

        /* --- VIEWPORT --- */
        .viewport { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 64px 24px 48px; z-index: 1; }

        /* --- LOGO & TITRE --- */
        .hero-section { text-align: center; margin-bottom: 48px; margin-top: 40px; opacity: 0; animation: fadeUp 0.8s forwards; }
        
        .logo-icon { width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); border: 1px solid var(--glass-border); display: flex; justify-content: center; align-items: center; font-size: 32px; color: var(--text-pure); margin: 0 auto 24px; box-shadow: 0 16px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1); backdrop-filter: blur(20px); }
        .logo-icon i { filter: drop-shadow(0 0 10px rgba(255, 42, 85, 0.6)); color: var(--brand-accent); }

        .hero-section h1 { font-family: 'Outfit', sans-serif; font-size: 36px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; margin-bottom: 8px; }
        .hero-section p { font-size: 14px; color: var(--text-dim); }

        /* --- FORMULAIRE --- */
        .form-container { display: flex; flex-direction: column; gap: 16px; opacity: 0; animation: fadeUp 0.8s 0.1s forwards; }

        .input-group { position: relative; display: flex; flex-direction: column; }
        .input-group i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--text-dim); font-size: 20px; transition: 0.3s; pointer-events: none; }
        
        .glass-input {
            width: 100%; height: 60px; background: var(--glass-input); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 0 20px 0 52px; color: var(--text-pure);
            font-family: 'Inter', sans-serif; font-size: 15px; outline: none; transition: all 0.3s;
            backdrop-filter: blur(12px); box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }
        .glass-input::placeholder { color: rgba(255,255,255,0.2); }
        
        /* État focus : Le bordeaux/néon s'allume */
        .glass-input:focus { border-color: var(--glass-border-focus); background: rgba(255, 42, 85, 0.05); box-shadow: 0 0 20px rgba(255, 42, 85, 0.15), inset 0 2px 10px rgba(0,0,0,0.2); }
        .glass-input:focus + i { color: var(--brand-accent); }

        /* Dark Pattern : Mot de passe oublié (Minuscule et terne) */
        .forgot-link { align-self: flex-end; font-size: 11px; color: var(--text-dim); text-decoration: none; margin-top: -4px; margin-bottom: 8px; transition: 0.2s; }
        .forgot-link:active { color: var(--text-pure); }

        /* Dark Pattern : Checkbox pré-cochée pour l'upsell marketing */
        .sneaky-optin { display: flex; align-items: flex-start; gap: 12px; padding: 0 4px; margin-bottom: 24px; cursor: pointer; }
        .checkbox { width: 20px; height: 20px; border-radius: 6px; border: 1px solid var(--brand-accent); background: rgba(255, 42, 85, 0.1); display: flex; justify-content: center; align-items: center; flex-shrink: 0; transition: 0.2s; }
        .checkbox i { font-size: 14px; color: var(--brand-accent); opacity: 1; transition: 0.2s; }
        .sneaky-optin.unchecked .checkbox { border-color: var(--glass-border); background: var(--glass-input); }
        .sneaky-optin.unchecked .checkbox i { opacity: 0; }
        .optin-text { font-size: 11px; color: var(--text-dim); line-height: 1.4; }
        .optin-text span { color: var(--text-pure); font-weight: 600; }

        /* --- CTA PRINCIPAL (L'Appât) --- */
        .btn-primary {
            width: 100%; height: 60px; border-radius: 100px; border: none;
            background: linear-gradient(135deg, #FFFFFF 0%, #E2E2E2 100%); color: var(--bg-base);
            font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 1px;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            box-shadow: 0 16px 32px rgba(255,255,255,0.15), inset 0 -4px 10px rgba(0,0,0,0.1);
            cursor: pointer; transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden;
        }
        .btn-primary i { font-size: 20px; color: var(--brand-core); }
        .btn-primary::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent); transform: translateX(-100%) skewX(-20deg); transition: 0.5s; }
        .btn-primary:active { transform: scale(0.96); box-shadow: 0 8px 16px rgba(255,255,255,0.1); }

        /* --- SOCIAL LOGIN --- */
        .separator { display: flex; align-items: center; gap: 16px; margin: 32px 0; opacity: 0; animation: fadeUp 0.8s 0.2s forwards; }
        .separator::before, .separator::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
        .separator span { font-size: 10px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        .social-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; opacity: 0; animation: fadeUp 0.8s 0.3s forwards; }
        .btn-social {
            height: 56px; border-radius: 20px; background: var(--glass-input); border: 1px solid var(--glass-border);
            color: var(--text-pure); font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            backdrop-filter: blur(12px); cursor: pointer; transition: 0.2s;
        }
        .btn-social i { font-size: 24px; }
        .btn-social:active { transform: scale(0.96); background: rgba(255,255,255,0.05); }

        /* --- FOOTER (Dark Pattern Élitisme) --- */
        .footer { margin-top: auto; text-align: center; opacity: 0; animation: fadeUp 0.8s 0.4s forwards; }
        .footer p { font-size: 13px; color: var(--text-dim); }
        .footer a { color: var(--brand-accent); font-weight: 600; text-decoration: none; padding-bottom: 2px; border-bottom: 1px solid rgba(255, 42, 85, 0.3); transition: 0.2s; }
        .footer a:active { color: #fff; border-color: #fff; }

        /* --- ANIMATIONS --- */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { from { opacity: 0.6; transform: translateX(-50%) scale(1); } to { opacity: 0.9; transform: translateX(-50%) scale(1.05); } }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading i { animation: spin 1s linear infinite; }
    </style>
</head>
<body>
    <div class="device">
        <div class="ambient-glow">
            <div class="glow-1"></div>
            <div class="glow-2"></div>
        </div>

        <div class="viewport">
            
            <div class="hero-section">
                <div class="logo-icon"><i class="ph-fill ph-infinity"></i></div>
                <h1>L'Élite.</h1>
                <p>Connectez-vous pour accéder à votre sélection.</p>
            </div>

            <div class="form-container">
                <div class="input-group">
                    <input type="email" class="glass-input" placeholder="Adresse e-mail" id="email" required>
                    <i class="ph ph-envelope-simple"></i>
                </div>

                <div class="input-group">
                    <input type="password" class="glass-input" placeholder="Mot de passe" id="password" required>
                    <i class="ph ph-lock-key"></i>
                </div>

                <a href="#" class="forgot-link">Mot de passe oublié ?</a>

                <div class="sneaky-optin" id="optin">
                    <div class="checkbox"><i class="ph-bold ph-check"></i></div>
                    <div class="optin-text">Rester connecté et recevoir les opportunités <span>Ultra VIP</span> en avant-première.</div>
                </div>

                <button class="btn-primary" id="login-btn">
                    ACCÉDER AU CLUB <i class="ph-bold ph-arrow-right"></i>
                </button>
            </div>

            <div class="separator"><span>OUVERTURE SÉCURISÉE</span></div>

            <div class="social-grid">
                <button class="btn-social">
                    <i class="ph-fill ph-apple-logo"></i> Apple
                </button>
                <button class="btn-social">
                    <i class="ph-fill ph-google-logo" style="color: #fff;"></i> Google
                </button>
            </div>

            <div class="footer">
                <p>Vous n'êtes pas encore membre ? <a href="#">Postuler ici.</a></p>
            </div>

        </div>
    </div>

    <script>
        // Logique de la checkbox (Dark Pattern)
        const optin = document.getElementById('optin');
        optin.addEventListener('click', () => {
            optin.classList.toggle('unchecked');
        });

        // Animation de chargement sur le bouton
        const loginBtn = document.getElementById('login-btn');
        loginBtn.addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if(email && password) {
                // Change l'état du bouton
                loginBtn.innerHTML = '<i class="ph-bold ph-circle-notch"></i> VÉRIFICATION...';
                loginBtn.classList.add('loading');
                loginBtn.style.pointerEvents = 'none';

                // Simule une requête réseau
                setTimeout(() => {
                    loginBtn.innerHTML = '<i class="ph-bold ph-check"></i> ACCÈS AUTORISÉ';
                    loginBtn.classList.remove('loading');
                    loginBtn.style.background = 'linear-gradient(135deg, #4ade80 0%, #22c55e 100%)';
                    loginBtn.style.color = '#fff';
                    
                    // Ici on redirigerait vers la page d'accueil (ou l'upsell !)
                }, 2000);
            } else {
                // Petit feedback visuel si champs vides
                loginBtn.style.transform = 'translateX(5px)';
                setTimeout(() => loginBtn.style.transform = 'translateX(-5px)', 50);
                setTimeout(() => loginBtn.style.transform = 'translateX(5px)', 100);
                setTimeout(() => loginBtn.style.transform = 'translateX(0)', 150);
            }
        });
    </script>
</body>
</html>
