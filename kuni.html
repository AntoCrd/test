<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Match | Galerie Luxe & Upsell</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Palette Bordeaux Cinématique */
            --brand-core: #55121C; 
            --brand-glow: #ff2a55;
            --brand-gold: #E5B9A8; /* Accent luxe */
            
            --bg-deep: #050102;
            
            /* Glassmorphism */
            --glass-bg: rgba(20, 5, 8, 0.6);
            --glass-blur: blur(24px) saturate(150%);
            --glass-border: rgba(255, 255, 255, 0.1);
            
            --noise: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: #000; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }

        .device {
            width: 375px; height: 812px; position: relative; border-radius: 44px; overflow: hidden;
            background: var(--bg-deep); box-shadow: 0 0 0 2px #1a1a1a, 0 40px 100px rgba(0,0,0,1);
        }

        /* --- AMBIANCE LUMINEUSE --- */
        .ambient { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
        .ambient::after { content: ''; position: absolute; inset: 0; background: var(--noise); opacity: 0.05; mix-blend-mode: overlay; }
        
        /* Un énorme halo bordeaux en haut pour rappeler ta maquette, mais avec de la profondeur */
        .glow-top { position: absolute; top: -20%; left: 50%; transform: translateX(-50%); width: 150%; height: 600px; background: radial-gradient(circle, rgba(85, 18, 28, 0.8) 0%, rgba(85, 18, 28, 0.2) 40%, transparent 70%); }

        /* --- CONTENEUR PRINCIPAL --- */
        .viewport { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 120px 16px 40px; z-index: 1; }
        .viewport::-webkit-scrollbar { display: none; }

        /* --- NAVIGATION FLOTTANTE (TOP PILL) --- */
        .nav-pill {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); background: var(--glass-bg);
            backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border); border-radius: 100px;
            display: flex; justify-content: space-around; align-items: center;
            padding: 12px 16px; z-index: 100;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
        }
        
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: rgba(255,255,255,0.4); text-decoration: none; font-size: 10px; font-weight: 600; cursor: pointer; transition: 0.3s; position: relative; }
        .nav-item i { font-size: 22px; transition: 0.3s; }
        
        /* L'état actif (Match) est mis en valeur */
        .nav-item.active { color: #fff; }
        .nav-item.active i { color: var(--brand-glow); filter: drop-shadow(0 0 8px rgba(255, 42, 85, 0.6)); }
        .nav-item.active::after { content: ''; position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--brand-glow); }

        /* --- EN-TÊTE DE SECTION --- */
        .page-header { margin-bottom: 24px; text-align: center; opacity: 0; animation: fadeUp 0.8s forwards; }
        .page-header h1 { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 900; line-height: 1; letter-spacing: -0.5px; }
        .page-header p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 8px; }
        .highlight { color: var(--brand-glow); font-weight: 700; }

        /* --- GRILLE MAÇONNERIE (MASONRY) --- */
        .masonry-grid {
            column-count: 2; /* 2 colonnes */
            column-gap: 12px; /* Espace entre les colonnes */
            width: 100%;
        }

        /* --- CARTE PROFIL --- */
        .match-card {
            break-inside: avoid; /* Empêche la carte d'être coupée entre deux colonnes */
            margin-bottom: 12px;
            position: relative; border-radius: 20px; overflow: hidden;
            background: #111; cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            /* Animation d'entrée en cascade */
            opacity: 0; transform: translateY(20px);
            animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        .match-card:active { transform: scale(0.97); }

        /* Un fin reflet de verre autour de l'image */
        .match-card::after { content: ''; position: absolute; inset: 0; border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; pointer-events: none; z-index: 5; }

        .match-img { width: 100%; display: block; object-fit: cover; transition: transform 0.5s; }
        .match-card:hover .match-img { transform: scale(1.05); }

        /* Dégradé pour lire les noms */
        .card-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(5,1,2,0.9) 0%, rgba(5,1,2,0.3) 40%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; z-index: 2; pointer-events: none; }

        .card-name { font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: #fff; margin-bottom: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .card-time { font-size: 10px; color: rgba(255,255,255,0.6); font-weight: 500; display: flex; align-items: center; gap: 4px; }

        /* --- DARK PATTERN (UPSELL) : LES CARTES FLOUTÉES --- */
        .match-card.blurred .match-img { filter: blur(12px) brightness(0.5); transform: scale(1.1); }
        .match-card.blurred .card-overlay { justify-content: center; align-items: center; text-align: center; background: rgba(85, 18, 28, 0.4); }
        
        .lock-icon { width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; font-size: 20px; color: #fff; margin-bottom: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); }
        .blur-text { font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 800; color: #fff; }

        /* --- BADGE NOUVEAU --- */
        .badge-new { position: absolute; top: 10px; left: 10px; background: var(--brand-glow); color: #fff; font-family: 'Outfit', sans-serif; font-size: 9px; font-weight: 900; padding: 4px 8px; border-radius: 100px; z-index: 3; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(255, 42, 85, 0.5); }

        /* --- BANNIÈRE D'APPÂT FLOTTANTE EN BAS --- */
        .upsell-banner {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 375px;
            padding: 24px 20px 32px; background: linear-gradient(to top, #000 40%, rgba(0,0,0,0.8) 70%, transparent 100%);
            z-index: 50; display: flex; flex-direction: column; align-items: center;
            opacity: 0; animation: fadeUp 0.8s 0.6s forwards;
        }
        
        .btn-upsell {
            width: 100%; padding: 18px; border-radius: 100px; border: none;
            background: linear-gradient(135deg, #fff 0%, #e0e0e0 100%); color: var(--brand-core);
            font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 900; letter-spacing: 0.5px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
            box-shadow: 0 10px 30px rgba(255,255,255,0.1); cursor: pointer; transition: 0.2s;
        }
        .btn-upsell:active { transform: scale(0.96); }

        /* KEYFRAMES */
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Délais d'animation en cascade pour la grille */
        .d-1 { animation-delay: 0.1s; } .d-2 { animation-delay: 0.2s; } .d-3 { animation-delay: 0.3s; }
        .d-4 { animation-delay: 0.4s; } .d-5 { animation-delay: 0.5s; }
    </style>
</head>
<body>
    <div class="device">
        <div class="ambient">
            <div class="glow-top"></div>
        </div>

        <nav class="nav-pill">
            <div class="nav-item"><i class="ph-fill ph-house"></i>Accueil</div>
            <div class="nav-item active"><i class="ph-fill ph-heart"></i>Matchs</div>
            <div class="nav-item"><i class="ph-fill ph-chat-circle-dots"></i>Tchat</div>
            <div class="nav-item"><i class="ph-fill ph-user"></i>Profil</div>
        </nav>

        <div class="viewport">
            
            <div class="page-header">
                <h1>Vos Admirateurs</h1>
                <p><span class="highlight">12 personnes</span> ont liké votre profil.</p>
            </div>

            <div class="masonry-grid">
                
                <article class="match-card d-1">
                    <div class="badge-new">RÉCENT</div>
                    <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=300&h=400&auto=format&fit=crop" class="match-img" style="height: 220px;">
                    <div class="card-overlay">
                        <div class="card-name">Elena, 26</div>
                        <div class="card-time"><i class="ph-fill ph-clock"></i> Il y a 2 min</div>
                    </div>
                </article>

                <article class="match-card d-2">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300&h=300&auto=format&fit=crop" class="match-img" style="height: 180px;">
                    <div class="card-overlay">
                        <div class="card-name">Sarah, 24</div>
                        <div class="card-time"><i class="ph-fill ph-clock"></i> Il y a 1h</div>
                    </div>
                </article>

                <article class="match-card blurred d-3">
                    <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=300&h=450&auto=format&fit=crop" class="match-img" style="height: 240px;">
                    <div class="card-overlay">
                        <div class="lock-icon"><i class="ph-fill ph-lock-key"></i></div>
                        <div class="blur-text">Qui est-ce ?</div>
                    </div>
                </article>

                <article class="match-card d-4">
                    <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=300&h=350&auto=format&fit=crop" class="match-img" style="height: 200px;">
                    <div class="card-overlay">
                        <div class="card-name">Chloé, 28</div>
                        <div class="card-time"><i class="ph-fill ph-clock"></i> Hier</div>
                    </div>
                </article>

                <article class="match-card blurred d-5">
                    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?q=80&w=300&h=300&auto=format&fit=crop" class="match-img" style="height: 190px;">
                    <div class="card-overlay">
                        <div class="lock-icon"><i class="ph-fill ph-lock-key"></i></div>
                        <div class="blur-text">Qui est-ce ?</div>
                    </div>
                </article>
                
                 <article class="match-card blurred d-5">
                    <img src="https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?q=80&w=300&h=400&auto=format&fit=crop" class="match-img" style="height: 210px;">
                    <div class="card-overlay">
                        <div class="lock-icon"><i class="ph-fill ph-lock-key"></i></div>
                        <div class="blur-text">Qui est-ce ?</div>
                    </div>
                </article>

            </div>
            
            <div style="height: 60px;"></div>
        </div>

        <div class="upsell-banner">
            <button class="btn-upsell">
                <i class="ph-fill ph-sparkle" style="color: #ff2a55;"></i>
                DÉBLOQUER TOUS LES MATCHS
            </button>
        </div>

    </div>

    <script>
        // Micro-interaction : Au clic sur une carte floutée, on simule le bouton d'upsell
        document.querySelectorAll('.match-card.blurred').forEach(card => {
            card.addEventListener('click', () => {
                const btn = document.querySelector('.btn-upsell');
                // Fait vibrer le bouton d'upsell pour diriger l'attention
                btn.style.transform = 'scale(1.05)';
                btn.style.boxShadow = '0 0 30px rgba(255,255,255,0.4)';
                setTimeout(() => {
                    btn.style.transform = 'scale(1)';
                    btn.style.boxShadow = '0 10px 30px rgba(255,255,255,0.1)';
                }, 200);
            });
        });
    </script>
</body>
</html>
