<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RunAlert — Page introuvable</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F4F5F8;--card:#FFFFFF;--acc:#FF3B30;--acc-glow:rgba(255,59,48,.25);--ink:#0B0F19;--sub:#848A9C;--faint:#B8BCC9;--df:'Outfit',sans-serif;--db:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--db);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}a{text-decoration:none;color:inherit}button{font-family:var(--db);cursor:pointer;border:none;background:none;color:inherit}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<!-- Logo -->
<div style="padding:20px 22px 0">
  <a href="index.html" style="display:flex;align-items:center;gap:10px">
    <div style="width:36px;height:36px;border-radius:10px;background:var(--acc);display:flex;align-items:center;justify-content:center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <span style="font-family:var(--df);font-size:20px;font-weight:900;letter-spacing:-.03em">Run<span style="color:var(--acc)">Alert</span></span>
  </a>
</div>

<!-- Content -->
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 32px;text-align:center">

  <!-- Animated icon -->
  <div style="width:120px;height:120px;border-radius:36px;background:rgba(255,59,48,.06);display:flex;align-items:center;justify-content:center;margin-bottom:32px;animation:bounce 2.5s ease-in-out infinite">
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--acc)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
      <line x1="9" x2="9.01" y1="9" y2="9" stroke-width="2.5"/>
      <line x1="15" x2="15.01" y1="9" y2="9" stroke-width="2.5"/>
    </svg>
  </div>

  <!-- 404 number -->
  <p style="font-family:var(--df);font-size:72px;font-weight:900;font-style:italic;color:var(--acc);letter-spacing:-.06em;line-height:1;opacity:.15;margin-bottom:-10px;animation:fadeIn .5s both">404</p>

  <h1 style="font-family:var(--df);font-size:26px;font-weight:900;letter-spacing:-.04em;line-height:1.15;margin-bottom:12px;animation:fadeIn .5s .1s both">Mauvais parcours<span style="color:var(--acc)">.</span></h1>

  <p style="color:var(--sub);font-size:15px;font-weight:500;line-height:1.6;max-width:280px;margin-bottom:32px;animation:fadeIn .5s .2s both">Cette page n'existe pas ou a été déplacée. Pas de panique, on vous remet sur la bonne route.</p>

  <div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;animation:fadeIn .5s .3s both">
    <a href="index.html" style="display:flex;align-items:center;justify-content:center;gap:7px;padding:15px 24px;border-radius:50px;background:var(--acc);font-size:14px;font-weight:700;color:#fff;box-shadow:0 4px 16px var(--acc-glow)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Retour à l'accueil
    </a>
    <a href="explore.html" style="display:flex;align-items:center;justify-content:center;gap:7px;padding:15px 24px;border-radius:50px;background:var(--card);font-size:14px;font-weight:600;color:var(--ink);box-shadow:0 4px 24px rgba(11,15,25,.06)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      Explorer les courses
    </a>
  </div>
</div>

<!-- Footer -->
<div style="padding:20px;text-align:center">
  <p style="color:var(--faint);font-size:11px;font-weight:500">RunAlert — Ne ratez plus aucune course</p>
</div>

</body>
</html>
