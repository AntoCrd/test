<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RunAlert — Explorer</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F4F5F8;--card:#FFFFFF;--hero:#13151A;--acc:#FF3B30;--acc-glow:rgba(255,59,48,.25);--ink:#0B0F19;--sub:#848A9C;--faint:#B8BCC9;--mute:#D4D7E0;--line:#ECEDF1;--shadow:0 4px 24px rgba(11,15,25,.06),0 1px 4px rgba(11,15,25,.04);--shadow-lg:0 8px 40px rgba(11,15,25,.08),0 2px 8px rgba(11,15,25,.05);--r-card:24px;--r-pill:50px;--font-display:'Outfit',sans-serif;--font-body:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-body);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:96px;overflow-x:hidden}
a{text-decoration:none;color:inherit}button{font-family:var(--font-body);cursor:pointer;border:none;background:none;color:inherit}::-webkit-scrollbar{display:none}
input{font-family:var(--font-body);font-size:15px;font-weight:500;color:var(--ink);background:var(--card);border:none;border-radius:var(--r-pill);outline:none;box-shadow:var(--shadow);transition:box-shadow .2s}
input:focus{box-shadow:var(--shadow-lg)}input::placeholder{color:var(--faint)}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.r{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:50ms}.d2{animation-delay:100ms}.d3{animation-delay:150ms}.d4{animation-delay:200ms}.d5{animation-delay:250ms}

.sticky-bar{padding:16px 22px 0;position:sticky;top:0;z-index:30;background:var(--canvas)}
.search-row{display:flex;gap:10px}
.search-input{flex:1;position:relative}
.search-input svg{position:absolute;left:20px;top:50%;transform:translateY(-50%)}
.search-input input{width:100%;padding:14px 20px 14px 48px}
.filter-btn{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:var(--shadow)}
.pills{display:flex;gap:6px;margin-top:14px;overflow-x:auto;padding-bottom:4px}
.pill{padding:9px 20px;border-radius:50px;font-size:13px;font-weight:500;white-space:nowrap;background:var(--card);color:var(--sub);box-shadow:var(--shadow);transition:all .25s}
.pill.active{background:var(--acc);color:#fff;box-shadow:0 2px 12px var(--acc-glow)}
.result-count{color:var(--faint);font-size:13px;font-weight:500;padding:18px 22px 0;margin-bottom:4px}
.race-item{display:flex;gap:16px;padding:18px;border-radius:var(--r-card);background:var(--card);box-shadow:var(--shadow);margin:0 22px 12px;align-items:center}
.race-icon{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.race-body{flex:1;min-width:0}
.race-meta{display:flex;align-items:center;gap:5px;margin-bottom:4px;font-size:12px;color:var(--sub);font-weight:500}
.race-name{font-family:var(--font-display);font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.015em;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race-status{font-size:12px;font-weight:500;color:var(--sub)}
.race-status.closing{color:#EAB308;font-weight:600}
.race-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between;flex-shrink:0}
.race-price{font-family:var(--font-display);font-size:17px;font-weight:900;font-style:italic}
.fav-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-top:8px;transition:background .2s}
.fav-btn.on{background:rgba(255,59,48,.08)}
.fav-btn.off{background:var(--canvas)}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;padding:0 16px 10px}
.bottom-nav-inner{border-radius:50px;padding:6px 8px;display:flex;justify-content:space-around;background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 -2px 20px rgba(11,15,25,.06)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:50px;position:relative}
.nav-label{font-size:10px;font-weight:500;color:var(--sub)}
.nav-item.active .nav-label{font-weight:700;color:var(--acc)}
.nav-badge{position:absolute;top:2px;right:4px;min-width:16px;height:16px;border-radius:50px;background:var(--acc);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 8px var(--acc-glow)}
</style>
</head>
<body>

<!-- ═══════ STICKY SEARCH ═══════ -->
<div class="sticky-bar">
  <div class="search-row">
    <div class="search-input">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B8BCC9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" type="text" placeholder="Course, ville, distance…">
    </div>
    <button class="filter-btn" onclick="document.getElementById('filterSheet').style.display='flex'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="4" y1="21" y2="14"/><line x1="4" x2="4" y1="10" y2="3"/><line x1="12" x2="12" y1="21" y2="12"/><line x1="12" x2="12" y1="8" y2="3"/><line x1="20" x2="20" y1="21" y2="16"/><line x1="20" x2="20" y1="12" y2="3"/><line x1="2" x2="6" y1="14" y2="14"/><line x1="10" x2="14" y1="8" y2="8"/><line x1="18" x2="22" y1="16" y2="16"/></svg>
    </button>
  </div>
  <div class="pills">
    <button class="pill active" onclick="filterAll()">Tout</button>
    <button class="pill" onclick="filterType(this,'ROAD')">Route</button>
    <button class="pill" onclick="filterType(this,'TRAIL')">Trail</button>
    <button class="pill" onclick="filterCat(this,'MARATHON')">Marathon</button>
    <button class="pill" onclick="filterCat(this,'10K')">10 km</button>
  </div>
</div>

<p class="result-count" id="count">6 résultats</p>

<!-- ═══════ RACE LIST ═══════ -->
<div id="raceList"></div>

<!-- ═══════ FILTER SHEET ═══════ -->
<div id="filterSheet" style="display:none;position:fixed;inset:0;z-index:60;align-items:flex-end" onclick="if(event.target===this)this.style.display='none'">
  <div style="position:absolute;inset:0;background:rgba(11,15,25,.25);backdrop-filter:blur(4px)"></div>
  <div style="position:relative;width:100%;max-width:430px;margin:0 auto;background:rgba(255,255,255,.92);backdrop-filter:blur(24px);border-radius:28px 28px 0 0;padding:10px 24px 38px;box-shadow:0 -8px 40px rgba(11,15,25,.1)">
    <div style="width:32px;height:3px;border-radius:50px;background:#D4D7E0;margin:0 auto 24px"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px">
      <h3 style="font-family:var(--font-display);font-size:22px;font-weight:900;color:var(--ink);letter-spacing:-.03em">Filtres</h3>
      <button style="color:var(--acc);font-size:13px;font-weight:600" onclick="filterAll();document.getElementById('filterSheet').style.display='none'">Réinitialiser</button>
    </div>
    <p style="color:var(--sub);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px">Type de course</p>
    <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap">
      <button class="pill" onclick="filterType(this,'ROAD');document.getElementById('filterSheet').style.display='none'">Route</button>
      <button class="pill" onclick="filterType(this,'TRAIL');document.getElementById('filterSheet').style.display='none'">Trail</button>
    </div>
    <p style="color:var(--sub);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px">Distance</p>
    <div style="display:flex;gap:8px;margin-bottom:32px;flex-wrap:wrap">
      <button class="pill" onclick="filterCat(this,'MARATHON');document.getElementById('filterSheet').style.display='none'">Marathon</button>
      <button class="pill" onclick="filterCat(this,'SEMI');document.getElementById('filterSheet').style.display='none'">Semi</button>
      <button class="pill" onclick="filterCat(this,'10K');document.getElementById('filterSheet').style.display='none'">10 km</button>
      <button class="pill" onclick="filterCat(this,'5K');document.getElementById('filterSheet').style.display='none'">5 km</button>
      <button class="pill" onclick="filterCat(this,'TRAIL');document.getElementById('filterSheet').style.display='none'">Trail</button>
    </div>
  </div>
</div>

<!-- ═══════ BOTTOM NAV ═══════ -->
<nav class="bottom-nav"><div class="bottom-nav-inner">
  <a href="index.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span class="nav-label">Accueil</span></a>
  <a href="explore.html" class="nav-item active"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg><span class="nav-label" style="color:#FF3B30;font-weight:700">Explorer</span></a>
  <a href="favorites.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span class="nav-label">Favoris</span></a>
  <a href="notifications.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="nav-label">Alertes</span><span class="nav-badge">2</span></a>
  <a href="profile.html" class="nav-item"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#848A9C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg><span class="nav-label">Profil</span></a>
</div></nav>

<script>
const races=[
{id:"1",slug:"detail.html",name:"Marathon de Paris",city:"Paris",date:"12 avr",type:"ROAD",cat:"MARATHON",reg:"Inscriptions ouvertes",closing:false,price:"130€",free:false,official:true,color:"#FF3B30",icon:'<path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/>',fav:true},
{id:"2",slug:"detail.html",name:"Trail des Aiguilles Rouges",city:"Chamonix",date:"18 juil",type:"TRAIL",cat:"TRAIL",reg:"Inscriptions ouvertes",closing:false,price:"75€",free:false,official:false,color:"#10B981",icon:'<path d="m8 3 4 8 5-5 2 15H2L8 3z"/>',fav:true},
{id:"3",slug:"detail.html",name:"Semi-Marathon de Bordeaux",city:"Bordeaux",date:"11 oct",type:"ROAD",cat:"SEMI",reg:"Inscriptions ouvertes",closing:false,price:"42€",free:false,official:false,color:"#7C3AED",icon:'<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',fav:false},
{id:"4",slug:"detail.html",name:"Marseille — Cassis",city:"Marseille",date:"25 oct",type:"ROAD",cat:"20K",reg:"Fermeture imminente",closing:true,price:"38€",free:false,official:true,color:"#0EA5E9",icon:'<path d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/>',fav:false},
{id:"5",slug:"detail.html",name:"10 km Nocturne de Lyon",city:"Lyon",date:"13 juin",type:"ROAD",cat:"10K",reg:"Inscriptions ouvertes",closing:false,price:"20€",free:false,official:false,color:"#8B5CF6",icon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',fav:true},
{id:"6",slug:"detail.html",name:"La Course du Cœur",city:"Nantes",date:"20 sept",type:"ROAD",cat:"5K",reg:"Inscriptions ouvertes",closing:false,price:"Gratuit",free:true,official:false,color:"#F43F5E",icon:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M12 5 9.04 7.96a2.17 2.17 0 0 0 0 3.08c.82.82 2.13.85 3 .07l2.07-1.9a2.82 2.82 0 0 1 3.79 0l2.96 2.66"/><path d="m18 15-2-2"/><path d="m15 18-2-2"/>',fav:false},
];

let currentFilter={type:"",cat:""};
const favSet=new Set(["1","2","5"]);

function render(list){
  const el=document.getElementById("raceList");
  document.getElementById("count").textContent=list.length+" résultat"+(list.length>1?"s":"");
  el.innerHTML=list.map((r,i)=>`
    <a href="${r.slug}" class="race-item r d${Math.min(i+1,5)}">
      <div class="race-icon" style="background:${r.color}0D">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="${r.color}" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${r.icon}</svg>
      </div>
      <div class="race-body">
        <div class="race-meta">
          ${r.official?'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FF3B30" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>':''}
          <span>${r.city} · ${r.date}</span>
        </div>
        <h4 class="race-name">${r.name}</h4>
        <span class="race-status ${r.closing?'closing':''}">${r.reg}</span>
      </div>
      <div class="race-right">
        <span class="race-price" style="color:${r.color}">${r.price}</span>
        <div class="fav-btn ${favSet.has(r.id)?'on':'off'}" onclick="event.preventDefault();event.stopPropagation();toggleFav('${r.id}',this)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="${favSet.has(r.id)?'#FF3B30':'none'}" stroke="${favSet.has(r.id)?'#FF3B30':'#D4D7E0'}" stroke-width="${favSet.has(r.id)?0:1.5}" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </div>
      </div>
    </a>
  `).join("");
}

function applyFilter(){
  let list=races;
  const q=document.getElementById("search").value.toLowerCase();
  if(q) list=list.filter(r=>r.name.toLowerCase().includes(q)||r.city.toLowerCase().includes(q));
  if(currentFilter.type) list=list.filter(r=>r.type===currentFilter.type);
  if(currentFilter.cat) list=list.filter(r=>r.cat===currentFilter.cat);
  render(list);
}

function filterAll(){
  currentFilter={type:"",cat:""};
  document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));
  document.querySelector(".pill").classList.add("active");
  applyFilter();
}
function filterType(el,t){
  currentFilter={type:currentFilter.type===t?"":t,cat:""};
  document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));
  if(currentFilter.type) el.classList.add("active"); else document.querySelector(".pill").classList.add("active");
  applyFilter();
}
function filterCat(el,c){
  currentFilter={type:"",cat:currentFilter.cat===c?"":c};
  document.querySelectorAll(".pill").forEach(p=>p.classList.remove("active"));
  if(currentFilter.cat) el.classList.add("active"); else document.querySelector(".pill").classList.add("active");
  applyFilter();
}
function toggleFav(id,el){
  if(favSet.has(id)){favSet.delete(id)}else{favSet.add(id)}
  applyFilter();
}

document.getElementById("search").addEventListener("input",applyFilter);
render(races);
</script>
</body>
</html>
