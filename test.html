<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE STUDIO | COMMAND_CENTER_V5</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --txt: #FFFFFF;
            --red: #FF0000;
            --border: #1a1a1a;
            --grid: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; cursor: crosshair; }
        body { background-color: var(--bg); color: var(--txt); font-family: 'Space Mono', monospace; overflow: hidden; }

        /* --- NAVIGATION HUD OPTIMISÉE --- */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 90px;
            display: grid; grid-template-columns: 200px 1fr auto;
            align-items: center; padding: 0 40px;
            border-bottom: 1px solid var(--border);
            background: rgba(0,0,0,0.95); z-index: 10000;
            backdrop-filter: blur(15px);
        }

        .nav-logo { font-family: 'Space Mono'; font-weight: bold; font-size: 14px; letter-spacing: 2px; }
        
        .nav-links { display: flex; justify-content: center; gap: 40px; list-style: none; }
        .nav-links a {
            text-decoration: none; color: var(--txt); font-size: 10px;
            text-transform: uppercase; letter-spacing: 3px; opacity: 0.5;
            transition: 0.3s; position: relative; padding: 10px 0;
        }
        .nav-links a:hover, .nav-links a.active { opacity: 1; color: var(--red); }
        .nav-links a.active::after {
            content: ""; position: absolute; bottom: 0; left: 0;
            width: 100%; height: 1px; background: var(--red);
            box-shadow: 0 0 10px var(--red);
        }

        /* ACTIONS DROITE */
        .nav-actions { display: flex; align-items: center; gap: 40px; }
        .nav-telemetry { display: flex; flex-direction: column; align-items: flex-end; font-size: 9px; gap: 4px; }
        .tcr { color: var(--red); font-weight: bold; }
        
        /* BOUTON RÉSERVATION DIRECT */
        .btn-reserve-nav {
            background: var(--red);
            color: white;
            padding: 12px 25px;
            font-family: 'Anton';
            font-size: 14px;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 2px;
            transition: 0.3s;
            border: 1px solid var(--red);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-reserve-nav:hover {
            background: transparent;
            color: var(--red);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        .btn-reserve-nav span { font-size: 10px; opacity: 0.8; }

        /* --- VUES (PAGES) --- */
        .view-container { height: 100vh; width: 100%; overflow-y: auto; padding-top: 90px; display: none; }
        .view-container.active { display: block; }

        .page-content { max-width: 1300px; margin: 0 auto; padding: 100px 40px; }
        .label-red { display: inline-block; border: 1px solid var(--red); color: var(--red); padding: 5px 12px; font-size: 10px; text-transform: uppercase; margin-bottom: 25px; letter-spacing: 3px; }
        .t-huge { font-family: 'Anton'; font-size: clamp(3rem, 10vw, 8rem); line-height: 0.85; text-transform: uppercase; margin-bottom: 40px; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .dot { width: 6px; height: 6px; background: var(--red); border-radius: 50%; animation: blink 1s infinite; }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">LE STUDIO.</div>
        
        <ul class="nav-links">
            <li><a href="#" class="active" data-view="home">ACCUEIL</a></li>
            <li><a href="#" data-view="concept">MANIFESTE</a></li>
            <li><a href="#" data-view="programme">PROGRAMME</a></li>
        </ul>

        <div class="nav-actions">
            <div class="nav-telemetry">
                <div class="tcr">TCR <span id="clock">18:16:02:34</span></div>
                <div style="display: flex; align-items: center; gap: 8px; opacity: 0.6;">DATA LINK <div class="dot"></div></div>
            </div>
            <a href="#" class="btn-reserve-nav" data-view="reserve">
                <span>[+]</span> ÉMETTRE TICKET
            </a>
        </div>
    </nav>

    <main id="home" class="view-container active">
        <div class="page-content">
            <span class="label-red">MISSION_STATUS: ACTIVE</span>
            <h1 class="t-huge">BIENVENUE DANS<br>LA ZONE_02.</h1>
            </div>
    </main>

    <main id="concept" class="view-container">
        <div class="page-content">
            <span class="label-red">DÉCRYPTAGE_SYSTEME</span>
            <h1 class="t-huge">LE MANIFESTE<br>90 JOURS.</h1>
            </div>
    </main>

    <main id="programme" class="view-container">
        <div class="page-content">
            <span class="label-red">TRIPTYQUE_TRIMESTRIEL</span>
            <h1 class="t-huge">PROGRAMMATION<br>ÉPISODE 02.</h1>
            </div>
    </main>

    <main id="reserve" class="view-container">
        <div class="page-content">
            <span class="label-red">INITIALISER_BOOKING</span>
            <h1 class="t-huge">CONFIGURER<br>VOTRE MISSION.</h1>
            </div>
    </main>

    <script>
        // NAVIGATION ENGINE
        const links = document.querySelectorAll('[data-view]');
        const views = document.querySelectorAll('.view-container');

        links.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const targetView = link.getAttribute('data-view');

                // Update Active States
                links.forEach(l => l.classList.remove('active'));
                if(link.tagName === 'A' && !link.classList.contains('btn-reserve-nav')) {
                    link.classList.add('active');
                }

                // Switch Views
                views.forEach(v => {
                    v.classList.remove('active');
                    if(v.id === targetView) v.classList.add('active');
                });
            });
        });

        // TIME CODE ENGINE
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ms = String(Math.floor(now.getMilliseconds() / 10)).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}:${ms}`;
            requestAnimationFrame(updateClock);
        }
        updateClock();
    </script>
</body>
</html>
