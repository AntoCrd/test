<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE INDEX | Travaux & Archives</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Unbounded:wght@700;900&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #F4F4F2;
            --blue: #1A43FF;
            --lime: #CCFF00;
            --dark: #0A0A0A;
            --white: #FFFFFF;
            --font-display: 'Unbounded', sans-serif;
            --font-main: 'Manrope', sans-serif;
            --ease: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* --- BASE & ANTI-BUG --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg);
            color: var(--dark);
            font-family: var(--font-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 0 4vw;
        }

        /* --- CURSEUR PRO (FIXÉ) --- */
        #cursor-dot {
            position: fixed;
            top: 0;
            left: 0;
            width: 8px;
            height: 8px;
            background: var(--blue);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10001;
            pointer-events: none;
        }

        #cursor-follower {
            position: fixed;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 2px solid var(--blue);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            pointer-events: none;
            transition: transform 0.15s ease-out;
        }

        body.hovering #cursor-follower {
            width: 80px;
            height: 80px;
            background: var(--blue);
            border-color: transparent;
            mix-blend-mode: difference;
        }

        /* --- NAVIGATION PILL (1:1 IMAGE) --- */
        header {
            position: fixed;
            top: 24px;
            left: 0;
            width: 100%;
            z-index: 5000;
            display: flex;
            justify-content: center;
            pointer-events: none;
        }

        .nav-pill {
            pointer-events: auto;
            background: var(--white);
            padding: 8px 8px 8px 32px;
            border-radius: 50px;
            display: flex;
            gap: 32px;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-family: var(--font-display);
            font-weight: 900;
            color: var(--blue);
            font-size: 14px;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nav-links a {
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--blue);
        }

        .btn-hire {
            background: var(--blue);
            color: var(--white);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 11px;
            text-transform: uppercase;
            transition: transform 0.3s var(--ease);
        }

        .btn-hire:hover {
            transform: scale(1.05);
            background: var(--dark);
        }

        /* --- HERO (SANS CONTOUR) --- */
        .intro {
            padding: 180px 0 60px;
        }

        .massive-title {
            font-family: var(--font-display);
            font-weight: 900;
            font-size: clamp(3.5rem, 10vw, 150px);
            line-height: 0.85;
            letter-spacing: -6px;
            text-transform: uppercase;
        }

        .massive-title span {
            color: var(--blue);
            display: block;
        }

        /* Pas de stroke, bleu plein */

        /* --- TOOLBAR --- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 60px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 12px;
        }

        .filter-stk {
            padding: 12px 28px;
            border: 2.5px solid var(--dark);
            border-radius: 100px;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 12px;
            text-transform: uppercase;
            background: var(--white);
            box-shadow: 5px 5px 0 var(--dark);
            transition: all 0.3s var(--ease);
        }

        .filter-stk:hover,
        .filter-stk.active {
            background: var(--blue);
            color: var(--white);
            transform: translateY(-3px) rotate(-1deg);
            box-shadow: 8px 8px 0 var(--lime);
            border-color: var(--blue);
        }

        .sort-btn {
            margin-left: auto;
            background: var(--dark);
            color: var(--white);
            padding: 14px 24px;
            border-radius: 12px;
            font-family: var(--font-display);
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            border: none;
        }

        .sort-btn:hover {
            background: var(--blue);
        }

        /* --- GRILLE DE PROJETS --- */
        .grid-container {
            padding: 60px 0 120px;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 30px;
        }

        .project-card {
            background: var(--white);
            border: 3px solid var(--dark);
            border-radius: 32px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.08);
            transition: all 0.5s var(--ease);
            position: relative;
        }

        .project-card:hover {
            transform: translateY(-15px) rotate(1deg);
            box-shadow: 24px 24px 0 var(--blue);
            border-color: var(--blue);
            z-index: 10;
        }

        .project-card.hidden {
            display: none;
        }

        /* Tailles Bento */
        .p-large {
            grid-column: span 7;
            height: 550px;
        }

        .p-small {
            grid-column: span 5;
            height: 550px;
        }

        .p-wide {
            grid-column: span 12;
            height: 480px;
            flex-direction: row;
            gap: 40px;
        }

        .p-img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--dark);
            margin-bottom: 24px;
            background: #eee;
        }

        .p-wide .p-img {
            width: 60%;
            margin-bottom: 0;
        }

        .p-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: all 0.6s ease;
        }

        .project-card:hover .p-img img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .p-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .p-title {
            font-family: var(--font-display);
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            line-height: 1;
        }

        .p-tag {
            font-family: var(--font-main);
            font-weight: 800;
            font-size: 11px;
            color: var(--blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- CARD : PROJETS À VENIR --- */
        .card-soon {
            grid-column: span 6;
            background: var(--dark);
            color: var(--lime);
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 32px;
            border: 4px solid var(--blue);
            position: relative;
            overflow: hidden;
            box-shadow: 15px 15px 0 rgba(26, 67, 255, 0.2);
        }

        .card-soon::before {
            content: "";
            position: absolute;
            inset: 0;
            opacity: 0.1;
            background-image: repeating-linear-gradient(45deg, transparent, transparent 20px, var(--white) 20px, var(--white) 40px);
        }

        .soon-title {
            font-family: var(--font-display);
            font-size: 32px;
            text-transform: uppercase;
            line-height: 0.9;
            text-align: center;
            z-index: 2;
        }

        .soon-badge {
            background: var(--lime);
            color: var(--dark);
            padding: 8px 20px;
            border-radius: 50px;
            font-family: var(--font-display);
            font-weight: 900;
            font-size: 12px;
            margin-top: 24px;
            z-index: 2;
        }

        /* --- FOOTER --- */
        footer {
            background: var(--dark);
            color: var(--white);
            padding: 120px 0;
            border-radius: 60px 60px 0 0;
            text-align: center;
        }

        .footer-cta {
            font-family: var(--font-display);
            font-size: clamp(3rem, 10vw, 150px);
            font-weight: 900;
            text-transform: uppercase;
            line-height: 0.8;
            letter-spacing: -6px;
            margin-bottom: 40px;
        }

        .footer-cta:hover {
            color: var(--lime);
        }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) {

            .p-large,
            .p-small,
            .p-wide,
            .card-soon {
                grid-column: span 6;
                height: 450px;
                flex-direction: column;
            }

            .p-wide .p-img {
                width: 100%;
                height: 100%;
            }
        }

        @media (max-width: 768px) {
            .projects-grid {
                grid-template-columns: 1fr;
            }

            .p-large,
            .p-small,
            .p-wide,
            .card-soon {
                grid-column: span 1;
            }

            .archive-title {
                font-size: 4rem;
                letter-spacing: -3px;
            }

            .nav-links,
            #cursor-dot,
            #cursor-follower {
                display: none;
            }

            .toolbar {
                flex-direction: column;
                align-items: flex-start;
            }

            .sort-btn {
                margin-left: 0;
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

    <div id="cursor-dot"></div>
    <div id="cursor-follower"></div>

    <header>
        <div class="nav-pill">
            <div class="logo">DA.</div>
            <nav class="nav-links">
                <a href="index.html" class="it">Accueil</a>
                <a href="#" class="it">Travaux</a>
                <a href="mailto:hello@design.fr" class="it">Contact</a>
            </nav>
            <a href="mailto:hello@design.fr" class="btn-hire it">Me Contacter</a>
        </div>
    </header>

    <main class="container">
        <section class="intro">
            <h1 class="massive-title">
                INDEX_<span>TRAVAUX</span>
            </h1>

            <div class="toolbar">
                <div class="filter-group">
                    <button class="filter-stk active it" data-filter="all">Tout</button>
                    <button class="filter-stk it" data-filter="web">Web</button>
                    <button class="filter-stk it" data-filter="id">Identité</button>
                    <button class="filter-stk it" data-filter="print">Print</button>
                </div>
                <button class="sort-btn it" id="sortBtn">Trier par : Récent ↓</button>
            </div>
        </section>

        <section class="grid-container">
            <div class="projects-grid" id="projectGrid">

                <a href="#" class="project-card p-large it" data-cat="web" data-date="2026">
                    <div class="p-img"><img src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1200"
                            alt="Nova"></div>
                    <div class="p-footer">
                        <h2 class="p-title">Nova App</h2>
                        <span class="p-tag">UI/UX DESIGN</span>
                    </div>
                </a>

                <a href="#" class="project-card p-small it" data-cat="id" data-date="2025"
                    style="transform: rotate(2deg);">
                    <div class="p-img"><img
                            src="https://images.unsplash.com/photo-1600132806370-bf17e65e942f?q=80&w=1200" alt="Koto">
                    </div>
                    <div class="p-footer">
                        <h2 class="p-title">Koto Studio</h2>
                        <span class="p-tag">ART DIRECTION</span>
                    </div>
                </a>

                <a href="#" class="project-card p-wide it" data-cat="web" data-date="2025">
                    <div class="p-img"><img
                            src="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=1400" alt="Aura">
                    </div>
                    <div class="p-footer">
                        <h2 class="p-title">Aura E-Shop</h2>
                        <span class="p-tag">WEB DESIGN</span>
                    </div>
                </a>

                <a href="#" class="project-card p-small it" data-cat="print" data-date="2024"
                    style="transform: rotate(-1.5deg);">
                    <div class="p-img"><img
                            src="https://images.unsplash.com/photo-1629851496054-d830b561c272?q=80&w=1200" alt="Neon">
                    </div>
                    <div class="p-footer">
                        <h2 class="p-title">Neon Fest</h2>
                        <span class="p-tag">PRINT / ÉDITION</span>
                    </div>
                </a>

                <div class="project-card card-soon">
                    <h2 class="soon-title">PROJECT_05<br>EN COURS</h2>
                    <div class="soon-badge">SORTIE 2026</div>
                </div>

                <div class="project-card card-soon"
                    style="background: var(--blue); border-color: var(--dark); color: var(--white);">
                    <h2 class="soon-title">NOUVELLE<br>IDENTITÉ</h2>
                    <div class="soon-badge" style="background: var(--white);">STAY TUNED</div>
                </div>

            </div>
        </section>
    </main>

    <footer class="it">
        <div class="container">
            <h2 class="footer-cta">DISCUTONS.</h2>
            <p style="font-family: var(--font-display); font-weight: 900; color: var(--blue); letter-spacing: 1px;">
                HELLO@DESIGN-PORTFOLIO.FR</p>
        </div>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            const grid = document.getElementById('projectGrid');
            const cards = Array.from(document.querySelectorAll('.project-card'));
            const filterBtns = document.querySelectorAll('.filter-stk');
            const sortBtn = document.getElementById('sortBtn');
            let asc = false;

            // 1. CURSEUR
            if (!isTouch) {
                const dot = document.getElementById('cursor-dot');
                const follow = document.getElementById('cursor-follower');
                let mx = 0, my = 0, dx = 0, dy = 0, fx = 0, fy = 0;
                document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
                function anim() {
                    dx += (mx - dx) * 0.5; dy += (my - dy) * 0.5;
                    dot.style.left = dx + 'px'; dot.style.top = dy + 'px';
                    fx += (mx - fx) * 0.2; fy += (my - fy) * 0.2;
                    follow.style.left = fx + 'px'; follow.style.top = fy + 'px';
                    requestAnimationFrame(anim);
                }
                anim();
                document.querySelectorAll('.it').forEach(el => {
                    el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                    el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
                });
            }

            // 2. FILTRE
            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const f = btn.dataset.filter;
                    cards.forEach(c => {
                        if (f === 'all' || c.dataset.cat === f || c.classList.contains('card-soon')) {
                            c.classList.remove('hidden');
                        } else {
                            c.classList.add('hidden');
                        }
                    });
                });
            });

            // 3. TRI DATE
            sortBtn.addEventListener('click', () => {
                asc = !asc;
                sortBtn.innerText = asc ? "Trier par : Ancien ↑" : "Trier par : Récent ↓";
                const sorted = cards.sort((a, b) => {
                    if (a.classList.contains('card-soon')) return 1;
                    if (b.classList.contains('card-soon')) return -1;
                    return asc ? a.dataset.date - b.dataset.date : b.dataset.date - a.dataset.date;
                });
                grid.innerHTML = "";
                sorted.forEach(c => grid.appendChild(c));
            });
        });
    </script>
</body>

</html>
