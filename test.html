<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RunAlert — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F4F5F8;--card:#FFFFFF;--acc:#FF3B30;--acc-glow:rgba(255,59,48,.25);--ink:#0B0F19;--sub:#848A9C;--faint:#B8BCC9;--mute:#D4D7E0;--line:#ECEDF1;--shadow:0 4px 24px rgba(11,15,25,.06),0 1px 4px rgba(11,15,25,.04);--shadow-lg:0 8px 40px rgba(11,15,25,.08),0 2px 8px rgba(11,15,25,.05);--df:'Outfit',sans-serif;--db:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--db);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}a{text-decoration:none;color:inherit}button{font-family:var(--db);cursor:pointer;border:none;background:none;color:inherit}::-webkit-scrollbar{display:none}
input,select{font-family:var(--db);font-size:15px;font-weight:500;color:var(--ink);background:var(--canvas);border:none;border-radius:16px;outline:none;padding:15px 18px;width:100%;transition:background .2s}
input:focus,select:focus{background:#ECEDF1}
input::placeholder{color:var(--faint)}
label{font-size:13px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.r{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:50ms}.d2{animation-delay:100ms}.d3{animation-delay:150ms}.d4{animation-delay:200ms}
</style>
</head>
<body>

<!-- Logo header -->
<div style="padding:24px 22px 0;display:flex;align-items:center;gap:10px" class="r">
  <a href="index.html" style="display:flex;align-items:center;gap:10px">
    <div style="width:40px;height:40px;border-radius:12px;background:var(--acc);display:flex;align-items:center;justify-content:center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    </div>
    <span style="font-family:var(--df);font-size:22px;font-weight:900;letter-spacing:-.03em">Run<span style="color:var(--acc)">Alert</span></span>
  </a>
</div>

<!-- Content -->
<div style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 22px">
  <h1 class="r d1" style="font-family:var(--df);font-size:30px;font-weight:900;letter-spacing:-.04em;line-height:1.1;margin-bottom:8px" id="pageTitle">Bon retour<span style="color:var(--acc)">.</span></h1>
  <p class="r d1" style="color:var(--sub);font-size:14px;font-weight:500;margin-bottom:32px" id="pageDesc">Connectez-vous pour retrouver vos courses et rappels.</p>

  <!-- Toggle tabs -->
  <div class="r d2" style="display:flex;background:var(--card);border-radius:50px;padding:4px;box-shadow:var(--shadow);margin-bottom:28px">
    <button id="tabLogin" onclick="switchTab('login')" style="flex:1;padding:11px;border-radius:50px;font-size:14px;font-weight:700;background:var(--acc);color:#fff;transition:all .25s;box-shadow:0 2px 8px var(--acc-glow)">Connexion</button>
    <button id="tabRegister" onclick="switchTab('register')" style="flex:1;padding:11px;border-radius:50px;font-size:14px;font-weight:600;color:var(--sub);transition:all .25s">Inscription</button>
  </div>

  <!-- Login form -->
  <div id="loginForm" class="r d3">
    <div style="background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow)">
      <div style="margin-bottom:18px">
        <label>Email</label>
        <div style="position:relative">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B8BCC9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:16px;top:50%;transform:translateY(-50%)"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <input type="email" placeholder="vous@email.com" style="padding-left:44px">
        </div>
      </div>
      <div style="margin-bottom:8px">
        <label>Mot de passe</label>
        <div style="position:relative">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B8BCC9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:16px;top:50%;transform:translateY(-50%)"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" placeholder="••••••••" style="padding-left:44px">
        </div>
      </div>
      <div style="text-align:right;margin-bottom:24px">
        <a href="#" style="color:var(--acc);font-size:13px;font-weight:600">Mot de passe oublié ?</a>
      </div>
      <button onclick="location.href='index.html'" style="width:100%;padding:15px;border-radius:50px;background:var(--acc);font-size:15px;font-weight:700;color:#fff;box-shadow:0 4px 16px var(--acc-glow)">Se connecter</button>
    </div>

    <div style="display:flex;align-items:center;gap:16px;margin:24px 0">
      <div style="flex:1;height:1px;background:var(--line)"></div>
      <span style="color:var(--faint);font-size:12px;font-weight:500">ou continuer avec</span>
      <div style="flex:1;height:1px;background:var(--line)"></div>
    </div>

    <div style="display:flex;gap:12px">
      <button style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:50px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--ink)">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Google
      </button>
      <button style="flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:50px;background:var(--ink);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:#fff">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83"/><path d="M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Apple
      </button>
    </div>
  </div>

  <!-- Register form (hidden by default) -->
  <div id="registerForm" style="display:none" class="r d3">
    <div style="background:var(--card);border-radius:24px;padding:24px;box-shadow:var(--shadow)">
      <div style="display:flex;gap:12px;margin-bottom:18px">
        <div style="flex:1"><label>Prénom</label><input type="text" placeholder="Lucas"></div>
        <div style="flex:1"><label>Nom</label><input type="text" placeholder="Dupont"></div>
      </div>
      <div style="margin-bottom:18px"><label>Email</label><input type="email" placeholder="vous@email.com"></div>
      <div style="margin-bottom:18px"><label>Mot de passe</label><input type="password" placeholder="8 caractères minimum"></div>
      <div style="margin-bottom:24px">
        <label>Je suis</label>
        <select style="appearance:none;background-image:url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2212%22 height=%2212%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23848A9C%22 stroke-width=%222%22><path d=%22m6 9 6 6 6-6%22/></svg>');background-repeat:no-repeat;background-position:right 16px center">
          <option>Coureur</option>
          <option>Organisateur</option>
        </select>
      </div>
      <button onclick="location.href='index.html'" style="width:100%;padding:15px;border-radius:50px;background:var(--acc);font-size:15px;font-weight:700;color:#fff;box-shadow:0 4px 16px var(--acc-glow)">Créer mon compte</button>
    </div>
  </div>
</div>

<script>
function switchTab(mode){
  const login=document.getElementById('loginForm');
  const reg=document.getElementById('registerForm');
  const tL=document.getElementById('tabLogin');
  const tR=document.getElementById('tabRegister');
  const title=document.getElementById('pageTitle');
  const desc=document.getElementById('pageDesc');
  if(mode==='login'){
    login.style.display='block';reg.style.display='none';
    tL.style.background='var(--acc)';tL.style.color='#fff';tL.style.boxShadow='0 2px 8px var(--acc-glow)';
    tR.style.background='none';tR.style.color='var(--sub)';tR.style.boxShadow='none';
    title.innerHTML='Bon retour<span style="color:var(--acc)">.</span>';
    desc.textContent='Connectez-vous pour retrouver vos courses et rappels.';
  } else {
    login.style.display='none';reg.style.display='block';
    tR.style.background='var(--acc)';tR.style.color='#fff';tR.style.boxShadow='0 2px 8px var(--acc-glow)';
    tL.style.background='none';tL.style.color='var(--sub)';tL.style.boxShadow='none';
    title.innerHTML='Rejoignez-nous<span style="color:var(--acc)">.</span>';
    desc.textContent='Créez votre compte et ne ratez plus aucune course.';
  }
}
</script>
</body>
</html>
