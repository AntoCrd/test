<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RunAlert — Favoris</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{--canvas:#F4F5F8;--card:#FFFFFF;--acc:#FF3B30;--acc-glow:rgba(255,59,48,.25);--ink:#0B0F19;--sub:#848A9C;--faint:#B8BCC9;--line:#ECEDF1;--shadow:0 4px 24px rgba(11,15,25,.06),0 1px 4px rgba(11,15,25,.04);--r:24px;--df:'Outfit',sans-serif;--db:'Plus Jakarta Sans',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:var(--db);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;max-width:430px;margin:0 auto;min-height:100vh;padding-bottom:96px}a{text-decoration:none;color:inherit}button{font-family:var(--db);cursor:pointer;border:none;background:none;color:inherit}::-webkit-scrollbar{display:none}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}.r{animation:rise .5s cubic-bezier(.22,1,.36,1) both}.d1{animation-delay:50ms}.d2{animation-delay:100ms}.d3{animation-delay:150ms}

.page-title{font-family:var(--df);font-size:28px;font-weight:900;letter-spacing:-.04em}.dot{color:var(--acc)}
.page-sub{color:var(--sub);font-size:13px;font-weight:500;margin-top:2px}
.fav-card{display:block;border-radius:var(--r);padding:20px;background:var(--card);box-shadow:var(--shadow);margin:0 22px 12px;position:relative;overflow:hidden}
.fav-card .orb{position:absolute;top:-15px;right:-15px;width:70px;height:70px;border-radius:50%;opacity:.06;filter:blur(25px)}
.fav-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;position:relative;z-index:1}
.fav-icon{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.fav-heart{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,59,48,.06)}
.fav-meta{color:var(--sub);font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px;margin-bottom:4px;position:relative;z-index:1}
.fav-name{font-family:var(--df);font-size:18px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;position:relative;z-index:1}
.fav-price{font-family:var(--df);font-size:16px;font-weight:900;font-style:italic;position:relative;z-index:1}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:50;padding:0 16px 10px}
.bottom-nav-inner{border-radius:50px;padding:6px 8px;display:flex;justify-content:space-around;background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 -2px 20px rgba(11,15,25,.06)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 14px;border-radius:50px;position:relative}.nav-label{font-size:10px;font-weight:500;color:var(--sub)}.nav-item.active .nav-label{font-weight:700;color:var(--acc)}
.nav-badge{position:absolute;top:2px;right:4px;min-width:16px;height:16px;border-radius:50px;background:var(--acc);color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 8px var(--acc-glow)}
</style>
</head>
<body>

<div style="padding:20px 22px" class="r">

</div>

  <h3 class="fav-name">10 km Nocturne de Lyon</h3>

<nav class="bottom-nav"><div class="bottom-nav-inner">
