<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AURA // Organic & Extensible</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- DESIGN SYSTEM : ORGANIC JAPANDI (LIGHT) --- */
        :root {
            --bg-base: #F4F1EB;
            --surface-1: #FFFFFF;
            --surface-2: #FAF8F5;
            --text-main: #33302E;
            --text-dim: #8C857B;
            --border-soft: #E8E3D9;
            --accent-sage: #7A907C;
            --accent-sage-bg: #EAF0EB;
            --accent-terra: #C26D5C;
            --accent-terra-bg: #F5EAE8;
            --radius-pill: 100px;
            --radius-card: 32px;
            --radius-btn: 24px;
            --shadow-float: 0 12px 30px rgba(140, 133, 123, 0.08);
            --transition-velvet: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            --theme-accent: var(--accent-sage);
            --theme-accent-bg: var(--accent-sage-bg);
        }

        /* --- DARK MODE --- */
        [data-theme="dark"] {
            --bg-base: #1A1817;
            --surface-1: #242120;
            --surface-2: #2E2A28;
            --text-main: #EFEBE4;
            --text-dim: #A39B93;
            --border-soft: #383431;
            --theme-accent: #92AA94;
            --theme-accent-bg: rgba(146, 170, 148, 0.15);
            --shadow-float: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        /* --- CRISIS MODE --- */
        body.crisis-active {
            --bg-base: #141212 !important;
            --surface-1: #241D1B !important;
            --surface-2: #302624 !important;
            --text-main: #F4F1EB !important;
            --text-dim: #A8A198 !important;
            --border-soft: #3D312E !important;
            --theme-accent: var(--accent-terra) !important;
            --theme-accent-bg: rgba(194, 109, 92, 0.15) !important;
            --shadow-float: 0 12px 30px rgba(0, 0, 0, 0.4) !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: var(--transition-velvet);
            user-select: none;
        }

        /* --- HEADER --- */
        .top-nav {
            height: 100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: -1px;
        }

        .zen-pill {
            background: var(--surface-1);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-float);
            padding: 10px 24px 10px 10px;
            border-radius: var(--radius-pill);
            display: flex;
            align-items: center;
            gap: 16px;
            transition: var(--transition-velvet);
            margin: 0 auto;
        }

        .ai-sun {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--theme-accent);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--bg-base);
            font-size: 1.2rem;
            transition: var(--transition-velvet);
            box-shadow: 0 0 0 8px var(--theme-accent-bg);
            animation: breathe 4s infinite alternate ease-in-out;
        }

        @keyframes breathe {
            0% {
                transform: scale(0.95);
                opacity: 0.9;
            }

            100% {
                transform: scale(1.05);
                opacity: 1;
                box-shadow: 0 0 0 12px var(--theme-accent-bg);
            }
        }

        .pill-text {
            font-size: 1.05rem;
            font-weight: 500;
        }

        .actions-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-theme {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: var(--surface-1);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-float);
            color: var(--text-main);
            font-size: 1.3rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: var(--transition-velvet);
        }

        .btn-theme:hover {
            transform: translateY(-2px);
        }

        body.crisis-active .btn-theme {
            opacity: 0.5;
            pointer-events: none;
        }

        .btn-trigger {
            background: var(--surface-1);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-float);
            color: var(--text-main);
            padding: 16px 28px;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition-velvet);
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Outfit';
        }

        .btn-trigger:hover {
            transform: translateY(-2px);
        }

        body.crisis-active .btn-trigger {
            background: var(--theme-accent-bg);
            border-color: var(--theme-accent);
            color: var(--theme-accent);
        }

        /* --- LAYOUT --- */
        .core-ui {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 0 30px 30px 30px;
            gap: 30px;
        }

        .dock {
            width: 80px;
            background: var(--surface-1);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-float);
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            gap: 30px;
            transition: var(--transition-velvet);
            z-index: 10;
        }

        .dock-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-dim);
            font-size: 1.3rem;
            cursor: pointer;
            transition: var(--transition-velvet);
        }

        .dock-icon.active {
            background: var(--text-main);
            color: var(--surface-1);
        }

        /* --- MASTER: SPACES --- */
        .master-view {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 10;
        }

        .overview-card {
            background: var(--surface-1);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-float);
            border-radius: var(--radius-card);
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: var(--transition-velvet);
        }

        .micro-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 4px;
        }

        .huge-value {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -0.04em;
            line-height: 1;
            color: var(--text-main);
        }

        .huge-value span {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-dim);
        }

        .space-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: none;
            padding-bottom: 20px;
        }

        .space-item {
            background: var(--surface-1);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-float);
            padding: 20px;
            border-radius: var(--radius-card);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition-velvet);
        }

        .space-item.active {
            border-color: var(--theme-accent);
            background: var(--theme-accent-bg);
            box-shadow: none;
        }

        .space-item.offline {
            opacity: 0.4;
            filter: grayscale(0.8);
            pointer-events: none;
            box-shadow: none;
        }

        .s-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .s-icon {
            width: 50px;
            height: 50px;
            border-radius: 20px;
            background: var(--surface-2);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            color: var(--text-dim);
            transition: var(--transition-velvet);
        }

        .space-item.active .s-icon {
            color: var(--theme-accent);
            background: var(--surface-1);
        }

        .s-name {
            font-weight: 600;
            font-size: 1.15rem;
            color: var(--text-main);
        }

        .s-status {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 4px;
            font-weight: 500;
        }

        .s-power {
            font-weight: 600;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        /* Bouton Ajouter Espace */
        .btn-add-room {
            border: 2px dashed var(--border-soft);
            border-radius: var(--radius-card);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            color: var(--text-dim);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-velvet);
            font-size: 1.1rem;
        }

        .btn-add-room:hover {
            background: var(--surface-1);
            color: var(--theme-accent);
            border-color: var(--theme-accent);
        }

        /* --- DETAIL: CONTROLS --- */
        .detail-view {
            flex: 1;
            background: var(--surface-1);
            border: 1px solid var(--border-soft);
            box-shadow: var(--shadow-float);
            border-radius: 40px;
            padding: 50px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            position: relative;
            transition: var(--transition-velvet);
            scrollbar-width: none;
            z-index: 10;
        }

        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        .room-title {
            font-size: 3.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            color: var(--text-main);
            line-height: 1;
        }

        .control-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .pebble-widget {
            background: var(--surface-2);
            border-radius: var(--radius-card);
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            transition: var(--transition-velvet);
            border: 1px solid transparent;
        }

        [data-theme="dark"] .pebble-widget {
            border-color: var(--border-soft);
        }

        .w-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .w-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .w-title i {
            color: var(--text-dim);
            font-size: 1.2rem;
        }

        /* Toggles & Sliders */
        .soft-toggle {
            position: relative;
            width: 60px;
            height: 34px;
            cursor: pointer;
        }

        .soft-toggle input {
            display: none;
        }

        .st-track {
            position: absolute;
            inset: 0;
            background: var(--border-soft);
            border-radius: 34px;
            transition: var(--transition-velvet);
        }

        .st-thumb {
            position: absolute;
            width: 26px;
            height: 26px;
            left: 4px;
            top: 4px;
            background: var(--surface-1);
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: var(--transition-velvet);
        }

        input:checked+.st-track {
            background: var(--theme-accent);
        }

        input:checked+.st-track .st-thumb {
            transform: translateX(26px);
        }

        .matte-slider {
            position: relative;
            width: 100%;
            height: 80px;
            background: var(--surface-1);
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            align-items: center;
            padding: 0 30px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.02);
            transition: var(--transition-velvet);
            border: 1px solid var(--border-soft);
        }

        .matte-slider.disabled {
            opacity: 0.4;
            filter: grayscale(1);
            pointer-events: none;
        }

        .ms-fill {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            background: var(--theme-accent-bg);
            transition: width 0.1s;
            border-right: 4px solid var(--theme-accent);
        }

        .ms-value {
            z-index: 2;
            font-size: 1.8rem;
            font-weight: 500;
            color: var(--text-main);
            pointer-events: none;
            transition: var(--transition-velvet);
        }

        input[type="range"].ms-input {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            z-index: 3;
        }

        /* Hardware */
        .hardware-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hw-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            background: var(--surface-1);
            border-radius: var(--radius-btn);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            transition: var(--transition-velvet);
            border: 1px solid var(--border-soft);
        }

        .hw-item.disabled {
            opacity: 0.5;
            box-shadow: none;
        }

        .hw-info h4 {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .hw-info p {
            font-size: 0.9rem;
            color: var(--text-dim);
            font-weight: 500;
        }

        .vital-tag {
            color: var(--theme-accent);
            background: var(--theme-accent-bg);
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 12px;
            margin-left: 10px;
            font-weight: 600;
        }

        /* --- MODAL AJOUT PIÈCE --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-velvet);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: var(--surface-1);
            width: 450px;
            border-radius: 40px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-soft);
            transform: translateY(30px);
            transition: var(--transition-velvet);
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0);
        }

        .modal-title {
            font-size: 2rem;
            font-weight: 500;
            color: var(--text-main);
            margin-bottom: 30px;
            letter-spacing: -0.02em;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-group label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-dim);
            margin-bottom: 10px;
        }

        .input-text {
            width: 100%;
            padding: 18px 24px;
            background: var(--surface-2);
            border: 1px solid var(--border-soft);
            border-radius: 20px;
            font-family: 'Outfit';
            font-size: 1.1rem;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .input-text:focus {
            border-color: var(--theme-accent);
            box-shadow: 0 0 0 4px var(--theme-accent-bg);
            background: var(--surface-1);
        }

        /* Grille des icônes */
        .icon-selector {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .icon-opt {
            aspect-ratio: 1;
            border-radius: 16px;
            background: var(--surface-2);
            border: 1px solid var(--border-soft);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            color: var(--text-dim);
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-opt.selected {
            background: var(--theme-accent);
            color: var(--surface-1);
            border-color: var(--theme-accent);
            transform: scale(1.05);
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 16px;
            margin-top: 40px;
        }

        .btn-cancel {
            padding: 14px 28px;
            border-radius: var(--radius-pill);
            font-family: 'Outfit';
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            background: transparent;
            border: none;
            color: var(--text-dim);
            transition: 0.2s;
        }

        .btn-cancel:hover {
            color: var(--text-main);
            background: var(--surface-2);
        }

        .btn-confirm {
            padding: 14px 28px;
            border-radius: var(--radius-pill);
            font-family: 'Outfit';
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            background: var(--theme-accent);
            color: var(--surface-1);
            border: none;
            transition: 0.2s;
        }

        .btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--theme-accent-bg);
        }
    </style>
</head>

<body>

    <nav class="top-nav">
        <div class="nav-logo">aura.</div>
        <div class="zen-pill">
            <div class="ai-sun" id="aiIcon"><i class="fa-solid fa-leaf"></i></div>
            <div class="pill-text" id="mainStatus">Équilibre énergétique optimal. Maison apaisée.</div>
        </div>
        <div class="actions-group">
            <button class="btn-theme" onclick="toggleTheme()" id="themeBtn" aria-label="Changer de thème">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="btn-trigger" onclick="toggleEmergency()" id="btnCrisis">
                <i class="fa-solid fa-cloud-bolt"></i> <span>Alerte Hivernale RTE</span>
            </button>
        </div>
    </nav>

    <div class="core-ui">
        <aside class="dock">
            <div class="dock-icon active"><i class="fa-solid fa-house-chimney"></i></div>
            <div class="dock-icon"><i class="fa-solid fa-chart-pie"></i></div>
            <div class="dock-icon"><i class="fa-solid fa-seedling"></i></div>
        </aside>

        <div class="master-view">
            <div class="overview-card">
                <div>
                    <div class="micro-label">Empreinte Instantanée</div>
                    <div class="huge-value" id="globalPowerLabel">0.00<span>kW</span></div>
                </div>
                <div
                    style="width: 56px; height: 56px; border-radius: 50%; background: var(--theme-accent-bg); color: var(--theme-accent); display: flex; justify-content: center; align-items: center; font-size: 1.5rem; transition: var(--transition-velvet);">
                    <i class="fa-solid fa-bolt"></i></div>
            </div>

            <div class="space-list" id="spacesContainer">
            </div>
        </div>

        <main class="detail-view">
            <header class="detail-header">
                <div>
                    <h1 class="room-title" id="roomTitle">Sélectionnez un espace</h1>
                    <div class="micro-label" id="roomSub" style="font-size: 1rem;">Contrôle environnemental</div>
                </div>
                <div style="text-align: right;">
                    <div class="micro-label">Demande Active</div>
                    <div class="huge-value" id="roomPowerLabel">0<span>W</span></div>
                </div>
            </header>

            <div class="control-grid">
                <div class="pebble-widget">
                    <div class="w-top">
                        <div class="w-title"><i class="fa-solid fa-temperature-three-quarters"></i> Confort Thermique
                        </div>
                        <label class="soft-toggle"><input type="checkbox" id="tglClim"
                                onchange="toggleSys('clim', this.checked)">
                            <div class="st-track">
                                <div class="st-thumb"></div>
                            </div>
                        </label>
                    </div>
                    <div class="matte-slider" id="boxClim">
                        <div class="ms-fill" id="fillClim"></div>
                        <div class="ms-value" id="valClim">21.0°C</div>
                        <input type="range" class="ms-input" id="slideClim" min="15" max="28" step="0.5"
                            oninput="updateSlide('clim', this.value)">
                    </div>
                </div>

                <div class="pebble-widget">
                    <div class="w-top">
                        <div class="w-title"><i class="fa-regular fa-sun"></i> Luminosité Douce</div>
                        <label class="soft-toggle"><input type="checkbox" id="tglLight"
                                onchange="toggleSys('light', this.checked)">
                            <div class="st-track">
                                <div class="st-thumb"></div>
                            </div>
                        </label>
                    </div>
                    <div class="matte-slider" id="boxLight">
                        <div class="ms-fill" id="fillLight"></div>
                        <div class="ms-value" id="valLight">80%</div>
                        <input type="range" class="ms-input" id="slideLight" min="0" max="100"
                            oninput="updateSlide('light', this.value)">
                    </div>
                </div>

                <div class="pebble-widget" style="grid-column: 1 / -1;">
                    <div class="w-title" style="margin-bottom: 10px;"><i class="fa-solid fa-plug"></i> Équipements de
                        l'espace</div>
                    <div class="hardware-list" id="hwContainer">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="addRoomModal">
        <div class="modal-box">
            <h2 class="modal-title">Nouvel Espace</h2>

            <div class="input-group">
                <label>Nom de la pièce</label>
                <input type="text" class="input-text" id="newRoomName" placeholder="Ex: Chambre d'amis, Véranda..."
                    autocomplete="off">
            </div>

            <div class="input-group">
                <label>Icône représentative</label>
                <div class="icon-selector">
                    <div class="icon-opt selected" id="ico-fa-bed" onclick="selectIcon('fa-bed')"><i
                            class="fa-solid fa-bed"></i></div>
                    <div class="icon-opt" id="ico-fa-bath" onclick="selectIcon('fa-bath')"><i
                            class="fa-solid fa-bath"></i></div>
                    <div class="icon-opt" id="ico-fa-utensils" onclick="selectIcon('fa-utensils')"><i
                            class="fa-solid fa-utensils"></i></div>
                    <div class="icon-opt" id="ico-fa-dumbbell" onclick="selectIcon('fa-dumbbell')"><i
                            class="fa-solid fa-dumbbell"></i></div>
                    <div class="icon-opt" id="ico-fa-book-open" onclick="selectIcon('fa-book-open')"><i
                            class="fa-solid fa-book-open"></i></div>
                    <div class="icon-opt" id="ico-fa-shirt" onclick="selectIcon('fa-shirt')"><i
                            class="fa-solid fa-shirt"></i></div>
                    <div class="icon-opt" id="ico-fa-gamepad" onclick="selectIcon('fa-gamepad')"><i
                            class="fa-solid fa-gamepad"></i></div>
                    <div class="icon-opt" id="ico-fa-fan" onclick="selectIcon('fa-fan')"><i class="fa-solid fa-fan"></i>
                    </div>
                    <div class="icon-opt" id="ico-fa-car" onclick="selectIcon('fa-car')"><i class="fa-solid fa-car"></i>
                    </div>
                    <div class="icon-opt" id="ico-fa-tree" onclick="selectIcon('fa-tree')"><i
                            class="fa-solid fa-tree"></i></div>
                </div>
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">Annuler</button>
                <button class="btn-confirm" onclick="confirmAddRoom()">Créer l'espace</button>
            </div>
        </div>
    </div>

    <script>
        // --- REAL-WORLD DATA ---
        let homeData = [
            {
                id: 'z1', name: 'Garage & Énergie', icon: 'fa-warehouse', isOnline: true,
                clim: { state: false, temp: 15.0, baseW: 0 },
                light: { state: false, val: 0, maxW: 60 },
                hw: [
                    { name: 'Recharge Peugeot e-208', draw: 3200, state: true, critical: false },
                    { name: 'Onduleur & Stockage', draw: 50, state: true, critical: true }
                ]
            },
            {
                id: 'z2', name: 'Espace de Vie', icon: 'fa-couch', isOnline: true,
                clim: { state: true, temp: 20.5, baseW: 650 },
                light: { state: true, val: 60, maxW: 100 },
                hw: [
                    { name: 'Écran OLED & Audio', draw: 120, state: true, critical: false },
                    { name: 'Lampes sur pied', draw: 15, state: true, critical: false }
                ]
            },
            {
                id: 'z3', name: 'Cuisine Ouverte', icon: 'fa-kitchen-set', isOnline: true,
                clim: { state: true, temp: 19.5, baseW: 400 },
                light: { state: true, val: 80, maxW: 120 },
                hw: [
                    { name: 'Réfrigérateur Principal', draw: 85, state: true, critical: true },
                    { name: 'Four Encastrable', draw: 2100, state: true, critical: false }
                ]
            }
        ];

        let activeZ = 'z2'; // Start on Salon
        let isEmergency = false;
        let isDark = false;
        let currentSelectedIcon = 'fa-bed';

        // --- MATH ENGINE ---
        function getZonePower(z) {
            if (!z.isOnline) return 0;
            let p = 0;
            if (z.clim.state) p += z.clim.baseW;
            if (z.light.state) p += Math.round((z.light.val / 100) * z.light.maxW);
            z.hw.forEach(h => { if (h.state) p += h.draw; });
            return p;
        }

        function updateGlobals() {
            let total = 0;
            homeData.forEach(z => {
                const p = getZonePower(z);
                total += p;
                const spEl = document.getElementById(`z-pow-${z.id}`);
                if (spEl) spEl.innerText = p + 'W';
            });
            document.getElementById('globalPowerLabel').innerHTML = (total / 1000).toFixed(2) + '<span>kW</span>';
            const currentZ = homeData.find(x => x.id === activeZ);
            document.getElementById('roomPowerLabel').innerHTML = getZonePower(currentZ) + '<span>W</span>';
        }

        // --- UI RENDERERS ---
        function renderMaster() {
            const list = document.getElementById('spacesContainer');
            list.innerHTML = '';

            homeData.forEach(z => {
                const activeCls = z.id === activeZ ? 'active' : '';
                const offCls = !z.isOnline ? 'offline' : '';

                list.innerHTML += `
                    <div class="space-item ${activeCls} ${offCls}" onclick="${!z.isOnline ? '' : `selectZone('${z.id}')`}">
                        <div class="s-info">
                            <div class="s-icon"><i class="fa-solid ${z.icon}"></i></div>
                            <div>
                                <div class="s-name">${z.name}</div>
                                <div class="s-status">Confort : ${z.clim.state ? z.clim.temp.toFixed(1) + '°C' : 'Veille'}</div>
                            </div>
                        </div>
                        <div class="s-power" id="z-pow-${z.id}">0W</div>
                    </div>
                `;
            });

            // Add Room Button
            if (!isEmergency) {
                list.innerHTML += `
                    <div class="btn-add-room" onclick="openModal()">
                        <i class="fa-solid fa-plus"></i> Nouvel Espace
                    </div>
                `;
            }

            updateGlobals();
        }

        function selectZone(id) {
            activeZ = id;
            const z = homeData.find(x => x.id === id);

            renderMaster();

            document.getElementById('roomTitle').innerText = z.name;

            document.getElementById('tglClim').checked = z.clim.state;
            document.getElementById('slideClim').value = z.clim.temp;
            syncSliderUI('clim', z.clim.temp, '°C', z.clim.state);

            document.getElementById('tglLight').checked = z.light.state;
            document.getElementById('slideLight').value = z.light.val;
            syncSliderUI('light', z.light.val, '%', z.light.state);

            const hwBox = document.getElementById('hwContainer');
            hwBox.innerHTML = '';
            z.hw.forEach((h, i) => {
                const tag = h.critical ? `<span class="vital-tag">Essentiel</span>` : '';
                hwBox.innerHTML += `
                    <div class="hw-item ${!h.state ? 'disabled' : ''}">
                        <div class="hw-info">
                            <h4>${h.name}</h4>
                            <p>Tirage : ${h.state ? h.draw : 0}W ${tag}</p>
                        </div>
                        <label class="soft-toggle">
                            <input type="checkbox" ${h.state ? 'checked' : ''} onchange="toggleHw(${i}, this.checked)" ${!z.isOnline ? 'disabled' : ''}>
                            <div class="st-track"><div class="st-thumb"></div></div>
                        </label>
                    </div>
                `;
            });
            updateGlobals();
        }

        function syncSliderUI(type, val, unit, isActive) {
            const box = document.getElementById(`box${type.charAt(0).toUpperCase() + type.slice(1)}`);
            const fill = document.getElementById(`fill${type.charAt(0).toUpperCase() + type.slice(1)}`);
            const txt = document.getElementById(`val${type.charAt(0).toUpperCase() + type.slice(1)}`);

            if (isActive) {
                box.classList.remove('disabled');
                let pct = type === 'clim' ? ((val - 15) / (28 - 15)) * 100 : val;
                fill.style.width = pct + '%';
                txt.innerText = val + unit;
            } else {
                box.classList.add('disabled');
                fill.style.width = '0%';
                txt.innerText = 'OFF';
            }
        }

        // --- INTERACTIONS ---
        window.toggleSys = function (type, isChecked) {
            const z = homeData.find(x => x.id === activeZ);
            z[type].state = isChecked;
            const val = type === 'clim' ? z.clim.temp : z.light.val;
            const unit = type === 'clim' ? '°C' : '%';
            syncSliderUI(type, val, unit, isChecked);
            updateGlobals();
            renderMaster();
        }

        window.updateSlide = function (type, val) {
            const z = homeData.find(x => x.id === activeZ);
            if (!z[type].state) {
                document.getElementById(`slide${type.charAt(0).toUpperCase() + type.slice(1)}`).value = type === 'clim' ? z.clim.temp : z.light.val;
                return;
            }
            if (type === 'clim') z.clim.temp = parseFloat(val);
            if (type === 'light') z.light.val = parseInt(val);
            const unit = type === 'clim' ? '°C' : '%';
            syncSliderUI(type, val, unit, true);
            updateGlobals();
            renderMaster();
        }

        window.toggleHw = function (idx, isChecked) {
            const z = homeData.find(x => x.id === activeZ);
            z.hw[idx].state = isChecked;
            selectZone(z.id);
        }

        // --- MODAL LOGIC (AJOUT DE PIÈCE) ---
        window.openModal = function () {
            document.getElementById('addRoomModal').classList.add('active');
            document.getElementById('newRoomName').value = '';
            document.getElementById('newRoomName').focus();
        }

        window.closeModal = function () {
            document.getElementById('addRoomModal').classList.remove('active');
        }

        window.selectIcon = function (iconClass) {
            currentSelectedIcon = iconClass;
            document.querySelectorAll('.icon-opt').forEach(el => el.classList.remove('selected'));
            document.getElementById('ico-' + iconClass).classList.add('selected');
        }

        window.confirmAddRoom = function () {
            const nameInput = document.getElementById('newRoomName').value.trim();
            if (!nameInput) return; // Empêche la création d'une pièce sans nom

            // Génération d'un ID unique
            const newId = 'z' + (homeData.length + 1);

            // Création de l'objet Pièce avec valeurs par défaut standard
            const newRoom = {
                id: newId,
                name: nameInput,
                icon: currentSelectedIcon,
                isOnline: true,
                clim: { state: true, temp: 20.0, baseW: 400 },
                light: { state: true, val: 50, maxW: 80 },
                hw: [
                    { name: 'Prises standards', draw: 0, state: false, critical: false }
                ]
            };

            homeData.push(newRoom); // Ajout dans la base de données JS
            closeModal();

            // Sélectionne automatiquement la nouvelle pièce pour montrer le résultat
            selectZone(newId);

            // Fait scroller la liste vers le bas pour voir la nouvelle pièce
            const list = document.getElementById('spacesContainer');
            setTimeout(() => { list.scrollTop = list.scrollHeight; }, 100);
        }

        // --- THEME & CRISIS ---
        window.toggleTheme = function () {
            isDark = !isDark;
            const btn = document.getElementById('themeBtn');
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
            } else {
                document.documentElement.removeAttribute('data-theme');
                btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
            }
        }

        window.toggleEmergency = function () {
            isEmergency = !isEmergency;
            const body = document.body;
            const statusTxt = document.getElementById('mainStatus');
            const btn = document.getElementById('btnCrisis');
            const aiIcon = document.getElementById('aiIcon');

            if (isEmergency) {
                body.classList.add('crisis-active');
                statusTxt.innerHTML = "Délestage en cours. Maison en préservation d'énergie.";
                btn.innerHTML = `<i class="fa-solid fa-leaf"></i> <span>Rétablir le confort</span>`;
                aiIcon.innerHTML = `<i class="fa-solid fa-shield-halved"></i>`;

                homeData.forEach(z => {
                    if (z.id === 'z1') { z.hw[0].state = false; }
                    if (z.id === 'z3') { z.hw[1].state = false; }
                    if (z.clim.state) { z.clim.temp -= 2; }
                });
            } else {
                body.classList.remove('crisis-active');
                statusTxt.innerHTML = "Équilibre énergétique optimal. Maison apaisée.";
                btn.innerHTML = `<i class="fa-solid fa-cloud-bolt"></i> <span>Alerte Hivernale RTE</span>`;
                aiIcon.innerHTML = `<i class="fa-solid fa-leaf"></i>`;

                homeData[0].hw[0].state = true;
                homeData[2].hw[1].state = true;
                homeData.forEach(z => {
                    z.isOnline = true;
                    if (z.clim.state) z.clim.temp += 2;
                });
            }
            selectZone('z1');
        }

        // Init
        renderMaster();
        selectZone(activeZ);
    </script>
</body>

</html>
